# The suite, on every push and pull request.
#
# It runs on a clone and nothing else: `samples/` and `sitemaps/` carry the
# tracked fixture subset (`scripts/tracked_fixtures.py`), and the tests that
# need the rest of the scrape -- the larger fixtures, the municipal generals'
# sitemaps, `data/` -- skip themselves with the command that would produce it.
# The dashboard tests run their JavaScript under node, which is installed
# here on purpose rather than inherited from the runner image: without it 42
# of them skip, and the root conftest refuses to start a CI session that has
# no node (issue #145). The whole job is a couple of minutes.
#
# The three commands that check the corpus against the parsers all read
# `data/` and so cannot run here. What stands in for them is inside the
# suite: `tests/fixture-record-hashes.tsv` pins what every tracked fixture
# parses to, and `tests/test_cli_dispatch.py` exercises all 275 election-id
# bindings of the five CLI dispatchers (issue #157).

name: tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from .python-version, the release the scraping laptop's
        # `python3` resolves to, and the newest release the code is known to
        # run on.
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-browser-report
          path: frontend/playwright-report/
          retention-days: 7
