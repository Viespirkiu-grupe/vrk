<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRK kandidatų naršyklė</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #1c1c1a; --muted: #6d6d68;
    --line: #e3e3de; --accent: #2456a4; --accent-soft: #eef2f9; --win: #22713c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); overflow: hidden; display: flex; flex-direction: column; }
  header { padding: 14px 22px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  header .stats { color: var(--muted); font-size: 13px; }
  header .hbtn { padding: 6px 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; cursor: pointer; font-size: 13.5px; }
  main { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 0; flex: 1; min-height: 0; }
  #left { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #searchbox { padding: 12px 12px 8px; }
  #search { width: 100%; padding: 9px 12px; font-size: 15px; border: 1px solid var(--line); border-radius: 8px; }
  #filters { padding: 0 12px 10px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
  #filters select { padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; font-size: 12.5px; width: 100%; min-width: 0; color: var(--ink); background: var(--panel); }
  #filterrow { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); }
  #count { flex: 1; }
  #csvBtn { padding: 4px 10px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; cursor: pointer; font-size: 12.5px; }
  #results { overflow-y: auto; flex: 1; }
  .row { padding: 7px 14px 7px 10px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; align-items: flex-start; gap: 8px; }
  .row:hover, .row.active { background: var(--accent-soft); }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row .rowmain { flex: 1; min-width: 0; overflow: hidden; }
  .row .nm { font-weight: 500; }
  .row .bd { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .row .pt { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .cnt { color: var(--accent); font-size: 12.5px; white-space: nowrap; }
  .row .cmpbox { margin: 4px 0 0; }
  #cmpbar { padding: 8px 12px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; font-size: 13px; background: var(--accent-soft); }
  #cmpbar[hidden] { display: none; }
  #cmpbar button { padding: 4px 10px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; cursor: pointer; font-size: 12.5px; }
  #person { padding: 22px 28px; overflow-y: auto; }
  #person .placeholder { color: var(--muted); margin-top: 40px; text-align: center; }
  .phead { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 18px; }
  .phead img { width: 92px; border-radius: 8px; border: 1px solid var(--line); }
  .phead h2 { margin: 0 0 4px; font-size: 22px; }
  .phead .meta { color: var(--muted); }
  .tabs { display: flex; gap: 6px; margin: 14px 0; flex-wrap: wrap; }
  .tabs button { padding: 7px 14px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; cursor: pointer; font-size: 14px; }
  .tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ecard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
  .ecard > summary { padding: 12px 16px; cursor: pointer; font-weight: 600; list-style: none; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .ecard > summary::-webkit-details-marker { display: none; }
  .ecard .party { color: var(--muted); font-size: 13px; font-weight: 400; }
  .ecard .win { color: var(--win); font-size: 13px; font-weight: 500; }
  .ecard .nores { color: var(--muted); font-size: 13px; font-weight: 400; font-style: italic; }
  .ecard .body { padding: 4px 16px 14px; border-top: 1px solid var(--line); }
  .sec { margin: 12px 0; }
  .sec h4 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  dl { margin: 0; display: grid; grid-template-columns: 260px 1fr; gap: 3px 14px; }
  dt { color: var(--muted); overflow-wrap: anywhere; }
  dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  dd a { color: var(--accent); font-size: 12.5px; }
  table.rec { border-collapse: collapse; font-size: 13.5px; margin: 4px 0; max-width: 100%; display: block; overflow-x: auto; }
  table.rec th, table.rec td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; min-width: 110px; }
  table.rec th { background: var(--accent-soft); font-weight: 600; }
  .tablewrap { overflow-x: auto; }
  table.cmp { border-collapse: collapse; width: 100%; font-size: 13.5px; background: var(--panel); }
  table.cmp th, table.cmp td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; white-space: pre-line; }
  table.cmp thead th { background: var(--accent-soft); position: sticky; top: 0; z-index: 2; }
  table.cmp th:first-child { position: sticky; left: 0; background: var(--accent-soft); z-index: 1; min-width: 180px; }
  table.cmp thead th:first-child { z-index: 3; }
  table.cmp td.null { color: var(--muted); }
  table.cmp td.unmapped { color: var(--muted); background: var(--bg); }
  .loading { color: var(--muted); padding: 20px; }
  .aggnote { color: var(--muted); font-size: 13px; margin: 6px 0 14px; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } #left { max-height: 50vh; } }
</style>
</head>
<body>
<header>
  <h1>VRK kandidatų naršyklė</h1>
  <span class="stats" id="topstats">kraunamas indeksas…</span>
  <button id="aggBtn" class="hbtn" style="margin-left:auto">📊 Rinkimų suvestinė</button>
  <button id="moversBtn" class="hbtn">📈 Didžiausi pokyčiai</button>
</header>
<main>
  <div id="left">
    <div id="searchbox"><input id="search" type="search" placeholder="Ieškokite asmens, partijos ar darbovietės…" autofocus></div>
    <div id="filters">
      <select id="fElection" title="Rinkimai"></select>
      <select id="fParty" title="Iškėlusi partija ar komitetas"></select>
      <select id="fMunicipality" title="Savivaldybė"></select>
      <select id="fConstituency" title="Vienmandatė apygarda (Seimo rinkimai)"></select>
      <select id="fRole" title="Pareigos, į kurias kandidatuota"></select>
      <select id="fWon" title="Rinkimų rezultatas"></select>
      <div id="filterrow">
        <span id="count"></span>
        <button id="csvBtn" title="Atsisiųsti dabartinę atranką CSV formatu">⬇ CSV</button>
      </div>
    </div>
    <div id="results"></div>
    <div id="cmpbar" hidden>
      <span id="cmpcount"></span>
      <button id="cmpGo">Palyginti</button>
      <button id="cmpClear">Išvalyti</button>
    </div>
  </div>
  <div id="person"><div class="placeholder">Pasirinkite asmenį — matysite rinkimus ir anketų atsakymus.</div></div>
</main>
<script>
"use strict";

// Election names come from people.json, which copies them from the one
// registry (scraper/elections.json). No election list lives in this file:
// three hand-maintained copies is what let 2011-vasario-27-savivaldybiu and
// six others ship as raw slugs (issue #63). An id the registry does not know
// falls back to itself, and the builder reports it.
let ELECTIONS = new Map();

const electionName = (id) => (ELECTIONS.get(id) || {}).name || id;
const electionShortName = (id) => (ELECTIONS.get(id) || {}).shortName || id;
// The general election whose term a by-election, repeat or re-vote fills --
// the registry's `parent` (issue #122); a general election has none.
const electionParent = (id) => (ELECTIONS.get(id) || {}).parent || null;
// Selecting an election means its term: the general itself and every
// seat-fill grouped under it. Matching the id alone made "2016 Seimas"
// exclude the 2017-2019 by-elections of that same Seimas, and nobody wants
// one seat-fill on its own -- though each stays pickable from its group.
const inElection = (e, id) => e.id === id || electionParent(e.id) === id;

// A nominator's lineage (issue #123): people.json's parties table carries
// `pr`, the registry's `predecessors` -- the organisations an entry
// continues, by a merger under a new name (TS-LKD from Tėvynės sąjunga and
// LKD), a change of legal form (the Vieningas Kaunas party from its
// committee from its 2011 independents' coalition), a registration taken
// over, or a re-brand that kept a third of its candidates. The links form a
// forest, so an entry has at most one successor and one root; the party
// facet offers each root once more as "<name> ir pirmtakai", and that row
// matches the whole lineage where the plain row matches the one nominator.
const PARTY_LINEAGE_PREFIX = "+";
let PARTY_LINEAGES = new Map();
const inParty = (e, value) => value.startsWith(PARTY_LINEAGE_PREFIX)
  ? (PARTY_LINEAGES.get(value.slice(PARTY_LINEAGE_PREFIX.length)) || new Set()).has(e.p)
  : e.p === value;

// The entry and everything it continues, depth-first in registry order, as
// [{id, depth}] over the ids the index carries -- a predecessor a subset
// build lacks is skipped, not invented.
function partyLineage(parties, id) {
  const out = [];
  const seen = new Set();
  const walk = (pid, depth) => {
    if (seen.has(pid) || !parties[pid]) return;
    seen.add(pid);
    out.push({ id: pid, depth });
    for (const pred of parties[pid].pr || []) walk(pred, depth + 1);
  };
  walk(id, 0);
  return out;
}

// The lineage roots: entries with predecessors that no other entry lists as
// one. Each becomes a group in the party facet.
function partyLineageRoots(parties) {
  const listed = new Set();
  for (const party of Object.values(parties)) for (const pred of party.pr || []) listed.add(pred);
  return Object.keys(parties).filter(id => (parties[id].pr || []).length && !listed.has(id));
}

// Money series for the assets & income chart. The first three are the keys
// every election from 2007 on declares under. The fourth exists because the
// 1996-1997 form does not split turtas from piniginės lėšos -- it publishes
// one summed figure -- so those elections leave the first two null and would
// otherwise chart no turtas at all, despite the page stating it. It is a
// different measure, not a fallback, so it gets its own series rather than
// being folded into the first.
// ORDER MATTERS: it is the order of MONEY_FIELDS in
// scripts/build_person_index.py, which people.json's "m" array follows and
// the Biggest movers picker indexes into.
const MONEY_SERIES = [
  ["Privalomas registruoti turtas", "turto-ir-pajamu-deklaracijos.privalomas-registruoti-turtas", "#2456a4"],
  ["Piniginės lėšos", "turto-ir-pajamu-deklaracijos.pinigines-lesos", "#7fa8d9"],
  ["Gautos pajamos", "turto-ir-pajamu-deklaracijos.gautos-pajamos", "#2c8a4b"],
  ["Turtas ir piniginės lėšos (metų pabaigoje)", "turto-ir-pajamu-deklaracijos.turtas-ir-pinigines-lesos-metu-pabaigoje", "#b5761f"],
];

// Render a declared figure the way the assets pane does: litas converted at
// the changeover rate and formatted as euro. Without this the compare table
// printed the stored number raw, so a 2008 income sat next to a 2024 one
// 3.4528x too large and unlabelled -- half the corpus declares in litas.
// A function declaration, so CONCEPT_ROWS below can reference it.
function moneyCell(value, record) {
  const n = parseMoney(value);
  if (n == null) return null;
  return fmtEUR(declaredInLitas(record) ? n / LITAS_PER_EURO : n);
}

// The income row resolves through the `deklaruotos-pajamos` concept, so the
// 1996-2000 records whose declared total the page contradicts show the
// employment row they do publish, said in so many words rather than left
// blank. See declaredIncome() below.
function incomeCell(value, record) {
  const income = declaredIncome(record.normalized || {});
  if (income.value == null) return null;
  const shown = fmtEUR(declaredInLitas(record) ? income.value / LITAS_PER_EURO : income.value);
  return income.employmentOnly ? `${shown} (darbo santykiai)` : shown;
}

// Education is an object -- {aprasas, irasai:[{issilavinimas,
// mokymo-istaigos-pavadinimas, specialybe, baigimo-metai}]} -- so the generic
// compactValue() rendered it as "irasai: issilavinimas: Aukštasis;
// mokymo-istaigos-pavadinimas: ..." across every column. One line per entry
// reads as what it is. (The 1997 municipal archive published a bare level
// string and is reshaped into this same object by
// scripts/reshape_1997_education.py, so there is one shape to render.)
//
// The concept map hands this cell two shapes, not one: `issilavinimas` maps
// to the object (`anketa.issilavinimas`) on the 1996-2002 elections and to
// the entry ARRAY (`….issilavinimas.irasai`) on the 43 others -- the fill
// gate measures the entries, not the container. Reading `value.irasai` off
// an array gave null, and the row rendered an em dash for 69,726
// candidacies whose records carry an education (issue #131).
function educationCell(value) {
  if (value == null || value === "") return null;
  if (typeof value !== "object") return String(value);
  const entries = Array.isArray(value) ? value : (value.irasai || []);
  const lines = entries.map((entry) => {
    // 2004-ep spells the institution key from its own column heading
    // ("Mokyklos įstaigos pavadinimas") on 360 of its 361 entries; reading
    // only the corpus-wide spelling rendered those institutions blank.
    const institution = entry["mokymo-istaigos-pavadinimas"] || entry["mokyklos-istaigos-pavadinimas"];
    const where = [institution, entry["specialybe"]].filter(Boolean).join(", ");
    const year = entry["baigimo-metai"] ? ` (${entry["baigimo-metai"]})` : "";
    return [entry.issilavinimas, where && `${where}${year}`].filter(Boolean).join(" — ")
        || (year ? year.trim() : "");
  }).filter(Boolean);
  if (!Array.isArray(value) && value.aprasas) lines.unshift(value.aprasas);
  return lines.length ? lines.join("\n") : null;
}

// The 2020-era biography's work-history table (`biografija.darbo-patirtis`,
// 17,666 records across 11 elections) -- one line per job, newest first as
// published. compactValue() would dump its raw keys.
function workHistoryCell(value) {
  if (value == null || value === "") return null;
  if (typeof value !== "object") return String(value);
  const lines = (value.irasai || []).map((entry) => {
    const span = [entry["darbo-pradzia"], entry["darbo-pabaiga"]].filter(Boolean).join("–");
    const what = [entry["darboviete"], entry["pareigos"]].filter(Boolean).join(", ");
    return [span, what].filter(Boolean).join(" — ");
  }).filter(Boolean);
  if (value.aprasas) lines.unshift(value.aprasas);
  return lines.length ? lines.join("\n") : null;
}

// A field that is a plain string in some eras and {id, number, name} in
// others -- `savivaldybe` and the 2019/2023 party list (issue #93's type
// split). Mirrors scraper/shared/kandidatura.py::_name_of.
function nameCell(value) {
  if (value && typeof value === "object" && !Array.isArray(value)) value = value.name;
  if (value == null || value === "") return null;
  return String(value);
}

// A criminal conviction is published in three shapes across the corpus -- a
// structured detail table (2016 on), a free-text explanation (2000-2015), and
// a bare yes/no -- so the compare row used to print the yes/no alone and lose
// the substance. This mirrors scraper/shared/conviction_details.teistumas():
// the same four states, resolved the same way. "Neklausta" is printed rather
// than left blank because a question VRK never asked is not a denial, and the
// two used to render identically.
// Each question is worded to suit its own paragraph, and the answer follows the
// wording: Taip/Ne, Yra/Nėra, Buvo/Nebuvo, Turiu/Neturiu.
const AFFIRMATIVE_ANSWERS = ["taip", "yra", "buvo", "turiu"];
const isAffirmative = (v) => typeof v === "string" && AFFIRMATIVE_ANSWERS.includes(v.trim().toLowerCase());

const RELATED_DECLARATIONS = {
  "ar-buvote-pripazintas-kaltu-del-sunkaus-nusikaltimo": "sunkus nusikaltimas",
  "ar-buvote-pripazintas-kaltu-uzsienyje": "užsienio teismas",
  "ar-buvote-pripazintas-kaltu-uzsienyje-del-politinio-persekiojimo": "užsienio teismas, politinis persekiojimas",
  "ar-buvote-pripazintas-kaltu-del-politinio-persekiojimo": "politinis persekiojimas",
  "ar-nebaigta-teismo-paskirta-bausme": "neatlikta bausmė",
};

function convictionCell(_value, record) {
  const anketa = (record.normalized || {}).anketa || {};
  const pareiskimai = anketa["pareiskimai"] || {};
  const declaration = pareiskimai["ar-buvote-pripazintas-kaltu"];
  const freeText = pareiskimai["teisiniai-argumentai"] || null;
  const entries = ((anketa["teistumo-detales"] || {}).irasai || []).filter(e => e && typeof e === "object");
  const declared = isAffirmative(declaration);
  // The neighbouring paragraphs of the 2000-2014 forms: a different question,
  // so it does not turn a "Ne" into a "Taip", but 20 records in the corpus
  // declare a conviction there and deny the main question, and printing the
  // "Ne" alone calls all 20 unconvicted.
  const related = Object.entries(RELATED_DECLARATIONS)
    .filter(([key]) => isAffirmative(pareiskimai[key]))
    .map(([, label]) => label);

  if (typeof declaration !== "string" || !declaration.trim()) {
    if (entries.length) return convictionLines(declaration, entries, freeText, related);
    return related.length ? ["Neklausta", `Taip: ${related.join("; ")}`].join("\n") : "Neklausta";
  }
  if (!declared) {
    return related.length ? [declaration, `Taip: ${related.join("; ")}`].join("\n") : declaration;
  }
  if (!entries.length && !freeText) {
    return convictionLines(`${declaration} — detalių nepaskelbta`, [], null, related);
  }
  return convictionLines(declaration, entries, freeText, related);
}


// The offence sits under one name in the 2016-2021 tables and another inside
// the nested offence records of the Rinkimų kodekso block.
const OFFENCE_KEYS = ["nusikalstama-veika", "kesinimosi-objektas-baudziamojo-kodekso-skyriaus-ir-straipsnio-pavadinimas"];

function convictionLines(declaration, entries, freeText, related) {
  const lines = [declaration];
  for (const entry of entries) {
    const offences = [entry, ...(entry["nusikalstamos-veikos"] || [])]
      .filter(o => o && typeof o === "object")
      .flatMap(o => OFFENCE_KEYS.map(k => o[k]).filter(v => typeof v === "string" && v));
    const where = [entry["nuosprendzio-data"], entry["nuosprendzio-institucija"]].filter(Boolean).join(", ");
    lines.push([where, offences.join("; ")].filter(Boolean).join(" — ") || "—");
  }
  if (freeText) lines.push(freeText);
  if (related && related.length) lines.push(`Taip: ${related.join("; ")}`);
  return lines.join("\n");
}

// The votes (issue #133): 29.5 million preference votes on 59,275
// candidacies reached no consumer. `votesCell` renders a count; the
// constituency row reads every round of the single-winner race off the
// record, mirroring scraper/shared/kandidatura.py's `apygardos-turai` --
// the 2000-2015 root block's vienmandatesBalsai / vienmandatesBalsai2, the
// presidential and 2003 pages' turai[], the 1996-1999 archive's per-candidacy
// turai -- because a dotted path can address round one only.
function votesCell(value) {
  const n = typeof value === "number" ? value : parseInt(value, 10);
  return Number.isFinite(n) ? fmtInt(n) : null;
}

function constituencyRounds(record) {
  const rounds = [];
  const push = (turas, balsai, procentai, vieta) => {
    if (typeof balsai !== "number") return;
    rounds.push({
      turas: typeof turas === "number" ? turas : 1,
      balsai,
      procentai: typeof procentai === "number" ? procentai : null,
      vieta: typeof vieta === "number" ? vieta : null,
    });
  };
  const root = record.kandidatavimas && typeof record.kandidatavimas === "object" && !Array.isArray(record.kandidatavimas)
    ? record.kandidatavimas : null;
  if (root) {
    for (const [n, key] of [[1, "vienmandatesBalsai"], [2, "vienmandatesBalsai2"]]) {
      const block = root[key];
      if (block && typeof block === "object") push(n, block.isViso, block.procentai, block.vieta);
    }
    if (!rounds.length && Array.isArray(root.turai)) {
      for (const t of root.turai) if (t && typeof t === "object") push(t.turas, t.balsai, t["procentai-nuo-galiojanciu"] ?? t.procentai, t.vieta);
    }
  }
  const archive = (record.normalized || {}).kandidatavimas;
  if (!rounds.length && Array.isArray(archive)) {
    for (const entry of archive) {
      if (!entry || !Array.isArray(entry.turai)) continue;
      for (const t of entry.turai) if (t && typeof t === "object") push(t.turas, t.balsai, null, t.vieta);
    }
  }
  return rounds.sort((a, b) => a.turas - b.turas);
}

const ROUND_NUMERALS = ["I", "II", "III"];
function constituencyVotesCell(value, record) {
  const rounds = constituencyRounds(record);
  // A record whose rounds cannot be read still has the mapped round-one
  // figure the resolver handed over; show that rather than a dash.
  if (!rounds.length) return votesCell(value);
  return rounds.map(r =>
    `${ROUND_NUMERALS[r.turas - 1] || r.turas} turas: ${fmtInt(r.balsai)}`
    + (r.procentai != null ? ` (${r.procentai.toLocaleString("lt-LT")} %)` : "")
    + (r.vieta != null ? `, ${r.vieta} vieta` : "")
  ).join("\n");
}

// Comparison rows. Each names a concept from docs/concept-map.json -- the
// checked-in, corpus-verified bridge whose per-election paths
// scripts/field_coverage.py gates against the data -- so this file carries
// no dotted path of its own and cannot drift from the corpus the way its
// old hand-maintained FIELD_MAP did (issue #87). `fallbacks` chains concepts
// that are one question split across page eras: einamos-pareigos is the
// 2020-on wording of the pre-2020 pagrindine-darboviete, and without the
// chain each half rendered permanently empty for the other's era. A `format`
// is (value, record) => string for concepts a bare compactValue() renders
// wrongly; `derived: true` marks concepts the formatter resolves from the
// whole record (the map's `derived` block), so no path lookup happens.
const CONCEPT_ROWS = [
  { concept: "einamos-pareigos", fallbacks: ["pagrindine-darboviete"], label: "Einamos pareigos / darbovietė" },
  { concept: "darbo-patirtis", format: workHistoryCell },
  { concept: "issilavinimas", format: educationCell },
  { concept: "iskele", format: nameCell },
  { concept: "naryste-politinese-organizacijose" },
  { concept: "savivaldybe", format: nameCell },
  { concept: "seimine-padetis" },
  { concept: "uzsienio-kalbos" },
  { concept: "pirmumo-balsai", format: votesCell },
  { concept: "apygardos-balsai", label: "Balsai apygardoje", format: constituencyVotesCell },
  { concept: "sarasas-balsai", format: votesCell },
  { concept: "privalomas-registruoti-turtas", format: moneyCell },
  { concept: "pinigines-lesos", format: moneyCell },
  { concept: "gautos-pajamos", format: incomeCell },
  { concept: "turtas-ir-pinigines-lesos", format: moneyCell },
  { concept: "turtas-ir-pinigines-lesos-metu-pradzioje", format: moneyCell },
  { concept: "kalendoriniais-metais-isigytas-turtas", format: moneyCell },
  { concept: "gautos-pajamos-darbo-santykiu", format: moneyCell },
  { concept: "teistumas", derived: true, format: convictionCell },
];

// The offices a candidacy ran for: the election's kind decides it everywhere
// except the council-and-mayor ballots, where the record itself says which
// via "r" (scripts/build_person_index.py, from scraper/shared/kandidatura.py):
// "m" a mayoral run alone, "tm" council and mayor on one ballot, absent a
// council run. A dual candidacy is two offices with two outcomes -- 448
// people in 2019/2023 won a council seat and lost the mayoralty -- so it
// carries "wt"/"wm", the per-office flags, beside "w", the any-office one;
// collapsing it to one office made those 448 "elected mayors" (issue #140).
const ROLE_LABELS = new Map([
  ["s", "Seimo narys"], ["t", "Tarybos narys"], ["m", "Meras"],
  ["p", "Prezidentas"], ["e", "EP narys"],
]);
const ROLE_BY_KIND = { seimo: "s", ep: "e", prezidento: "p", mero: "m" };
function rolesOf(e) {
  const kind = (ELECTIONS.get(e.id) || {}).kind;
  if (ROLE_BY_KIND[kind]) return [ROLE_BY_KIND[kind]];
  return [...(e.r || "t")];
}
// The outcome for one office: the per-office flag where the ballot had two
// offices, the candidacy's flag everywhere else.
function electedAs(e, role) {
  if (role === "m" && e.wm !== undefined) return e.wm;
  if (role === "t" && e.wt !== undefined) return e.wt;
  return e.w;
}
function roleLabel(e) {
  return rolesOf(e).map(c => ROLE_LABELS.get(c) || c).join(" / ");
}
// The offices actually won -- "Tarybos narys" for a dual candidate who took
// the council seat and lost the mayoralty; empty when nothing was won.
function electedLabel(e) {
  return rolesOf(e).filter(c => electedAs(e, c) === true).map(c => ROLE_LABELS.get(c) || c).join(" / ");
}

// ---------------------------------------------------------------------------
// Labels. Section headings and dt keys used to render as raw slugs
// ("turto-ir-pajamu-deklaracijos", 1,234 pairs on one person page). The
// Lithuanian labels come from docs/concept-map.json (label-lt, built at boot
// into CONCEPT_LABELS/SEGMENT_LABELS); the record sections, which are not
// concepts, are the bounded 11-name set below; anything else de-slugs, which
// cannot restore diacritics but beats the slug.
// ---------------------------------------------------------------------------
const SECTION_LABELS = {
  "profilis": "Profilis",
  "anketa": "Anketa",
  "biografija": "Biografija",
  "kandidatavimas": "Kandidatavimas",
  "gyvenamoji-vieta": "Gyvenamoji vieta",
  "turto-ir-pajamu-deklaracijos": "Turto ir pajamų deklaracijos",
  "privaciu-interesu-deklaracija": "Privačių interesų deklaracija",
  "politines-kampanijos-dalyvio-duomenys": "Politinės kampanijos dalyvio duomenys",
  "programa": "Programa",
  "kita": "Kita",
  "patiketiniai": "Patikėtiniai",
  // High-frequency keys that are not concepts and whose de-slug loses its
  // diacritics badly.
  "vardas-pavarde": "Vardas ir pavardė",
  "pastaba": "Pastaba",
  "pareiskimai": "Pareiškimai",
  "anksciau-isrinktas": "Anksčiau išrinktas",
  "politine-organizacija": "Politinė organizacija",
  "kandidatuoja-i": "Kandidatuoja į",
  "isrinktas": "Išrinktas",
  "isrinktasKaip": "Išrinktas kaip",
  "valiuta": "Valiuta",
  "seimos-nariai": "Šeimos nariai",
  "teisiniai-argumentai": "Teisiniai argumentai",
  // The root kandidatavimas block's camelCase keys, which would otherwise
  // de-slug into English ("Vrk candidate id").
  "vrkCandidateId": "VRK kandidato id",
  "roles": "Kandidatuoja į",
  "vienmandate": "Vienmandatė apygarda",
  "daugiamandate": "Daugiamandatė (sąrašas)",
  "sarasas": "Sąrašas",
  "numerisSarase": "Numeris sąraše",
  "porinkiminisNumerisSarase": "Porinkiminis numeris sąraše",
  "listNumber": "Sąrašo numeris",
  "listPosition": "Numeris sąraše",
  "postElectionPosition": "Porinkiminis numeris sąraše",
  "rezultatuSaltinis": "Rezultatų šaltinis",
  "name": "Pavadinimas",
  "number": "Numeris",
};

function deslug(key) {
  const words = String(key)
    .replace(/([a-ząčęėįšųūž])([A-ZĄČĘĖĮŠŲŪŽ])/g, "$1 $2")
    .replace(/-/g, " ")
    .toLowerCase();
  return words.charAt(0).toUpperCase() + words.slice(1);
}

let CONCEPT_LABELS = {};
let SEGMENT_LABELS = {};
function labelFor(key) {
  return SECTION_LABELS[key] || CONCEPT_LABELS[key] || SEGMENT_LABELS[key] || deslug(key);
}

let INDEX = null;
let CONCEPTS = {};
const recordCache = new Map();
const compareSet = new Map();

const fold = (s) => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase();

// Lithuanian counts three integer forms -- 1 asmuo, 2 asmenys, 11 asmenų --
// on a rule that is not "n === 1", so pick them through Intl rather than by
// hand. ("many" is Lithuanian's fraction form; it falls back to the genitive.)
const PLURAL = new Intl.PluralRules("lt");
const plural = (n, one, few, rest) => ({ one, few, many: rest, other: rest })[PLURAL.select(n)];
const fmtInt = (n) => n.toLocaleString("lt-LT");

function bootFailed(err) {
  const message = `Nepavyko įkelti duomenų: ${err.message || err}. ` +
    "Ar serveris paleistas iš saugyklos šaknies, šalia data/ ir docs/? " +
    "Paleiskite: python3 scripts/serve_dashboard.py";
  document.getElementById("topstats").textContent = "indekso įkelti nepavyko";
  const root = document.getElementById("person");
  root.innerHTML = "";
  const div = document.createElement("div");
  div.className = "placeholder";
  div.textContent = message;
  root.appendChild(div);
}

async function boot() {
  // The index changes after every corpus update; a cached stale copy makes
  // the app quietly disagree with the data on disk. The concept map rides
  // along: the comparison rows resolve through it, so the page carries no
  // path list of its own.
  let conceptMap;
  try {
    const [indexRes, mapRes] = await Promise.all([
      fetch("people.json", { cache: "no-store" }),
      fetch("../docs/concept-map.json", { cache: "no-store" }),
    ]);
    if (!indexRes.ok) throw new Error(`people.json: HTTP ${indexRes.status}`);
    if (!mapRes.ok) throw new Error(`docs/concept-map.json: HTTP ${mapRes.status}`);
    INDEX = await indexRes.json();
    conceptMap = await mapRes.json();
  } catch (err) {
    bootFailed(err);
    return;
  }
  ELECTIONS = new Map((INDEX.elections || []).map(e => [e.id, e]));
  CONCEPTS = conceptMap.concepts || {};
  for (const [id, spec] of Object.entries(CONCEPTS)) {
    if (!spec["label-lt"]) continue;
    CONCEPT_LABELS[id] = spec["label-lt"];
    // The last path segment usually spells the concept's own id, but not
    // always (issilavinimas resolves biografija.issilavinimas and friends);
    // both spellings label the raw per-election pane.
    for (const path of Object.values(spec.paths || {})) {
      for (const p of Array.isArray(path) ? path : [path]) {
        SEGMENT_LABELS[p.split(".").pop()] = spec["label-lt"];
      }
    }
  }
  for (const [id, spec] of Object.entries(conceptMap.derived || {})) {
    if (spec["label-lt"]) CONCEPT_LABELS[id] = spec["label-lt"];
  }
  const s = INDEX.stats;
  // The corpus vintage rides in stats (issue #89): the newest record's
  // provenance.parsedAt and the parser commit that built the index. Without
  // it, two coexisting people.json builds were indistinguishable on sight.
  const vintage = s.corpusParsedAt
    ? ` · duomenys ${s.corpusParsedAt.slice(0, 10)}${s.parserCommit ? ` (${s.parserCommit})` : ""}`
    : "";
  const topstats = document.getElementById("topstats");
  topstats.textContent =
    `${fmtInt(s.persons)} ${plural(s.persons, "asmuo", "asmenys", "asmenų")} · ` +
    `${fmtInt(s.records)} ${plural(s.records, "kandidatavimas", "kandidatavimai", "kandidatavimų")} · ` +
    `${fmtInt(s.personsInMultipleElections)} dalyvavo 2+ rinkimuose` + vintage;
  if (s.corpusParsedAt) {
    topstats.title = `korpuso naujausias įrašas ${s.corpusParsedAt}` +
      (s.generatedAt ? `; indeksas sugeneruotas ${s.generatedAt}` : "") +
      (s.parserCommit ? `; parserio versija ${s.parserCommit}` : "");
  }
  // A merged person answers to every name they ran under, so the search
  // haystack folds in each natural key's name — the canonical key's (the
  // display name follows the latest election and can differ from it: the
  // Gerasimovičienė→Gasperavičienė remarriage displays only the second
  // name) and every merged-away fragment's from "ak" — plus the canonical
  // names of every party that nominated them and each candidacy's
  // workplace/position string, so the box also answers "valstiečių" or
  // "Vilniaus universitetas" (issue #87).
  for (const p of INDEX.people) {
    const names = [p.k, ...(p.ak || [])].map(k => k.slice(0, k.lastIndexOf("|")));
    const partyNames = [...new Set(p.e.map(e => e.p).filter(Boolean))]
      .flatMap(id => { const party = INDEX.parties[id] || {}; return [party.n, party.f]; });
    const workplaces = p.e.map(e => e.wp);
    p._f = fold([...new Set([p.n, ...names, ...partyNames, ...workplaces])].filter(Boolean).join(" "));
  }
  buildFilters();
  document.getElementById("search").addEventListener("input", renderList);
  document.getElementById("search").addEventListener("keydown", (ev) => {
    if (ev.key === "ArrowDown") {
      const first = document.querySelector("#results .row");
      if (first) { ev.preventDefault(); first.focus(); }
    }
  });
  document.getElementById("moversBtn").addEventListener("click", showMovers);
  document.getElementById("aggBtn").addEventListener("click", showAggregates);
  document.getElementById("csvBtn").addEventListener("click", exportCSV);
  document.getElementById("cmpGo").addEventListener("click", showCompare);
  document.getElementById("cmpClear").addEventListener("click", () => {
    compareSet.clear();
    updateCompareBar();
    renderList();
  });
  renderList();
  // The pid is the durable deep link (issue #96). A pre-pid name|birth hash
  // and a merged-away fragment's key both still resolve — showPerson then
  // rewrites the URL to the pid, so old shared links keep working.
  const hashKey = decodeURIComponent(location.hash.slice(1));
  if (hashKey) {
    const p = INDEX.people.find(
      p => p.pid === hashKey || p.k === hashKey || (p.ak || []).includes(hashKey)
    );
    if (p) showPerson(p);
  }
}

// ---------------------------------------------------------------------------
// The left pane: search + facets over the index (issue #87). Every filter
// works off people.json alone — no record fetches — and they conjoin at the
// candidacy level: a person matches when at least one of their candidacies
// passes every active filter.
// ---------------------------------------------------------------------------

function addOption(select, value, label) {
  const option = document.createElement("option");
  option.value = value;
  option.textContent = label;
  select.appendChild(option);
  return option;
}

// The election dropdowns show terms, newest first: a general election is one
// row, or a group holding itself and its seat-fills when it has any (issue
// #122 -- 55 peers in one list hid which by-election belonged to which
// Seimas). people.json lists elections chronologically and a parent always
// precedes its children, so one pass suffices; a child whose parent the
// index does not carry (a subset build) stands on its own rather than vanish.
function electionTree(elections) {
  const groups = new Map();
  for (const e of elections) {
    const parent = e.parent && groups.get(e.parent);
    if (parent) parent.children.push(e);
    else groups.set(e.id, { election: e, children: [] });
  }
  return [...groups.values()].reverse();
}

function fillElectionSelect(select) {
  for (const { election, children } of electionTree(INDEX.elections || [])) {
    const label = election.shortName || election.id;
    if (!children.length) {
      addOption(select, election.id, label).title = election.name || "";
      continue;
    }
    const group = document.createElement("optgroup");
    group.label = label;
    select.appendChild(group);
    addOption(group, election.id, `${label} (visa kadencija)`).title =
      "Kartu su tos kadencijos naujais ir pakartotiniais rinkimais";
    for (const e of children) addOption(group, e.id, e.shortName || e.id).title = e.name || "";
  }
}

function buildFilters() {
  const fElection = document.getElementById("fElection");
  addOption(fElection, "", "— visi rinkimai —");
  fillElectionSelect(fElection);

  const partyCounts = new Map();
  for (const p of INDEX.people) {
    for (const e of p.e) if (e.p) partyCounts.set(e.p, (partyCounts.get(e.p) || 0) + 1);
  }
  // One row per nominator, most candidacies first -- except that a lineage
  // root becomes a group: its "ir pirmtakai" row first, then itself and
  // every organisation it continues, indented by depth, each with its own
  // count. A group sorts by the lineage's total, so Vieningas Kaunas (44 as
  // a party, 148 with its committee and coalition) sits where its history
  // puts it. Nothing is listed twice: an organisation inside a lineage has
  // its row in the group only.
  const fParty = document.getElementById("fParty");
  addOption(fParty, "", "— visi iškėlėjai —");
  const partyLabel = (id) => (INDEX.parties[id] || {}).n || id;
  PARTY_LINEAGES = new Map();
  const grouped = new Set();
  const rows = [];
  for (const root of partyLineageRoots(INDEX.parties || {})) {
    const lineage = partyLineage(INDEX.parties, root);
    if (lineage.length < 2) continue;
    const ids = lineage.map(l => l.id);
    PARTY_LINEAGES.set(root, new Set(ids));
    for (const id of ids) grouped.add(id);
    rows.push({ key: ids.reduce((n, id) => n + (partyCounts.get(id) || 0), 0), root, lineage });
  }
  for (const [id, count] of partyCounts) if (!grouped.has(id)) rows.push({ key: count, id });
  rows.sort((a, b) => b.key - a.key || (a.root || a.id).localeCompare(b.root || b.id));
  for (const row of rows) {
    if (!row.root) {
      addOption(fParty, row.id, `${partyLabel(row.id)} (${fmtInt(row.key)})`);
      continue;
    }
    const group = document.createElement("optgroup");
    group.label = partyLabel(row.root);
    fParty.appendChild(group);
    addOption(group, PARTY_LINEAGE_PREFIX + row.root, `${partyLabel(row.root)} ir pirmtakai (${fmtInt(row.key)})`).title =
      "Kartu su organizacijomis, iš kurių ši išaugo: susijungimai, pakeista teisinė forma, perimta registracija";
    for (const { id, depth } of row.lineage) {
      addOption(group, id, `${"· ".repeat(depth)}${partyLabel(id)} (${fmtInt(partyCounts.get(id) || 0)})`);
    }
  }

  const fMunicipality = document.getElementById("fMunicipality");
  addOption(fMunicipality, "", "— visos savivaldybės —");
  (INDEX.municipalities || [])
    .map((name, i) => [name, i])
    .sort((a, b) => a[0].localeCompare(b[0], "lt"))
    .forEach(([name, i]) => addOption(fMunicipality, String(i), name));

  // The single-mandate constituency by name (issue #133): one name per
  // district across the four label eras (scraper/shared/apygardos.py), which
  // is a name and not a boundary -- Kėdainių in 2000 and in 2020 are one row.
  const fConstituency = document.getElementById("fConstituency");
  addOption(fConstituency, "", "— visos apygardos —");
  (INDEX.constituencies || [])
    .map((name, i) => [name, i])
    .sort((a, b) => a[0].localeCompare(b[0], "lt"))
    .forEach(([name, i]) => addOption(fConstituency, String(i), name));

  const fRole = document.getElementById("fRole");
  addOption(fRole, "", "— visos pareigos —");
  for (const [code, label] of ROLE_LABELS) addOption(fRole, code, label);

  const fWon = document.getElementById("fWon");
  addOption(fWon, "", "— visi rezultatai —");
  addOption(fWon, "won", "tik išrinkti");
  addOption(fWon, "lost", "tik neišrinkti");
  addOption(fWon, "unknown", "be rezultatų duomenų");

  for (const id of ["fElection", "fParty", "fMunicipality", "fConstituency", "fRole", "fWon"]) {
    document.getElementById(id).addEventListener("change", renderList);
  }
}

function activeFilters() {
  const f = {
    election: document.getElementById("fElection").value,
    party: document.getElementById("fParty").value,
    municipality: document.getElementById("fMunicipality").value,
    constituency: document.getElementById("fConstituency").value,
    role: document.getElementById("fRole").value,
    won: document.getElementById("fWon").value,
  };
  f.any = !!(f.election || f.party || f.municipality || f.constituency || f.role || f.won);
  return f;
}

// The tri-state elected flag (issue #87): `w` is true, false, or absent —
// absent meaning VRK published no results for that ballot (five 2000
// municipalities; the 1997 pair joined its results in #92), not a loss.
function candidacyMatches(e, f) {
  if (f.election && !inElection(e, f.election)) return false;
  if (f.party && !inParty(e, f.party)) return false;
  if (f.municipality !== "" && e.sv !== +f.municipality) return false;
  if (f.constituency && e.ap !== +f.constituency) return false;
  if (f.role && !rolesOf(e).includes(f.role)) return false;
  // With an office chosen, the outcome is that office's: "Meras" + "tik
  // išrinkti" is the 60 mayors of a year, not the 60 plus the council
  // winners who also ran for mayor (issue #140).
  const w = f.role ? electedAs(e, f.role) : e.w;
  if (f.won === "won" && w !== true) return false;
  if (f.won === "lost" && w !== false) return false;
  if (f.won === "unknown" && w !== undefined) return false;
  return true;
}

function personMatches(p, q, f) {
  if (q && !p._f.includes(q)) return false;
  if (f.any && !p.e.some(e => candidacyMatches(e, f))) return false;
  return true;
}

// Matching stops at MATCH_CAP so a bare search does not walk all 60k people;
// only the first RENDER_LIMIT rows are built. The count says both numbers --
// it used to report the match count alone ("5,000+ shown") while 300 rows
// existed, which read as a claim about what was on screen.
const MATCH_CAP = 5000;
const RENDER_LIMIT = 300;

function latestPartyName(p) {
  for (let i = p.e.length - 1; i >= 0; i--) {
    const id = p.e[i].p;
    if (id) return (INDEX.parties[id] || {}).n || id;
  }
  return null;
}

function renderList() {
  const q = fold(document.getElementById("search").value.trim());
  const f = activeFilters();
  const out = [];
  for (const p of INDEX.people) {
    if (!personMatches(p, q, f)) continue;
    out.push(p);
    if (out.length >= MATCH_CAP) break;
  }
  const capped = out.length >= MATCH_CAP;
  const shown = Math.min(out.length, RENDER_LIMIT);
  document.getElementById("count").textContent =
    shown < out.length
      ? `rasta ${fmtInt(out.length)}${capped ? "+" : ""} · rodoma ${fmtInt(shown)}`
      : `rasta ${fmtInt(out.length)}`;
  const frag = document.createDocumentFragment();
  for (const p of out.slice(0, RENDER_LIMIT)) {
    const div = document.createElement("div");
    div.className = "row";
    div.dataset.key = p.pid;
    div.tabIndex = 0;
    div.setAttribute("role", "button");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.className = "cmpbox";
    box.title = "Pažymėti palyginimui";
    box.checked = compareSet.has(p.pid);
    box.addEventListener("click", (ev) => ev.stopPropagation());
    box.addEventListener("change", () => {
      if (box.checked) compareSet.set(p.pid, p);
      else compareSet.delete(p.pid);
      updateCompareBar();
    });
    const main = document.createElement("span");
    main.className = "rowmain";
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = p.n;
    const bd = document.createElement("span"); bd.className = "bd";
    bd.textContent = p.b ? `· ${p.b}` : "· gimimo data nežinoma";
    main.append(nm, " ", bd);
    const partyName = latestPartyName(p);
    if (partyName) {
      const pt = document.createElement("span"); pt.className = "pt";
      pt.textContent = partyName;
      main.appendChild(pt);
    }
    const cnt = document.createElement("span");
    cnt.className = "cnt";
    cnt.textContent = `Rinkimų: ${p.e.length}`;
    div.append(box, main, cnt);
    div.addEventListener("click", () => showPerson(p));
    div.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); showPerson(p); }
      else if (ev.key === "ArrowDown" && div.nextElementSibling) { ev.preventDefault(); div.nextElementSibling.focus(); }
      else if (ev.key === "ArrowUp") {
        ev.preventDefault();
        if (div.previousElementSibling) div.previousElementSibling.focus();
        else document.getElementById("search").focus();
      }
    });
    frag.appendChild(div);
  }
  const results = document.getElementById("results");
  results.replaceChildren(frag);
}

function updateCompareBar() {
  const bar = document.getElementById("cmpbar");
  bar.hidden = compareSet.size === 0;
  const n = compareSet.size;
  document.getElementById("cmpcount").textContent =
    `pažymėta: ${n} ${plural(n, "asmuo", "asmenys", "asmenų")}`;
  document.getElementById("cmpGo").disabled = n < 2;
}

// ---------------------------------------------------------------------------
// CSV export of the current selection (issue #87). Runs the same predicate
// as the list but uncapped, one row per matching (person, candidacy) pair;
// with no candidacy filter active a matched person exports whole. Semicolon
// separated and BOM-prefixed, which is what lt-LT Excel expects.
// ---------------------------------------------------------------------------

function csvField(value) {
  if (value == null) return "";
  const s = String(value);
  return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function exportCSV() {
  const q = fold(document.getElementById("search").value.trim());
  const f = activeFilters();
  const header = [
    "pid", "vardas_pavarde", "gimimo_data", "rinkimai", "data",
    "pareigos", "savivaldybe", "apygarda", "partijos_id", "partija", "isrinktas", "isrinktas_kaip",
    "pirmumo_balsai", "balsai_apygardoje",
    "issilavinimas",
    "turtas_eur", "pinigines_lesos_eur", "pajamos_eur",
    "turtas_ir_lesos_eur", "deklaruota_litais", "tik_darbo_santykiu_pajamos",
    "darboviete",
  ];
  const rows = [header];
  for (const p of INDEX.people) {
    if (!personMatches(p, q, f)) continue;
    for (const e of p.e) {
      if (f.any && !candidacyMatches(e, f)) continue;
      const m = e.m || [];
      rows.push([
        p.pid, p.n, p.b || "",
        e.id, (ELECTIONS.get(e.id) || {}).date || "",
        roleLabel(e),
        e.sv != null ? INDEX.municipalities[e.sv] : "",
        e.ap != null ? (INDEX.constituencies || [])[e.ap] : "",
        e.p || "", e.p ? ((INDEX.parties[e.p] || {}).n || "") : "",
        e.w === true ? "taip" : e.w === false ? "ne" : "",
        electedLabel(e),
        e.v ?? "", e.cv ?? "",
        e.ed ? ((INDEX.educationLevels || [])[e.ed - 1] || {}).label || "" : "",
        m[0] ?? "", m[1] ?? "", m[2] ?? "", m[3] ?? "",
        e.lt ? "taip" : "", e.ds ? "taip" : "",
        e.wp || "",
      ]);
    }
  }
  const body = rows.map(r => r.map(csvField).join(";")).join("\r\n");
  const blob = new Blob(["\ufeff" + body], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "vrk-atranka.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

function recordFile(e) {
  return `data/${e.id}/${e.c}-${e.id}.json`;
}

// A failed record must degrade to an error note on its card — never hang the
// whole person page (one 404 used to reject the Promise.all silently).
//
// no-store for the same reason people.json uses it, and it is not theoretical:
// records are rewritten in place when a parser gains a field — the 1996-1997
// declarations were backfilled into existing files — and a browser holding the
// pre-backfill copy showed empty asset rows against a corpus that had the
// figures, with no way to tell the difference from "never declared".
async function fetchRecord(e) {
  const file = recordFile(e);
  if (!recordCache.has(file)) {
    recordCache.set(
      file,
      fetch("../" + file, { cache: "no-store" })
        .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
        .catch(err => { recordCache.delete(file); return { _error: `${file}: ${err.message || err}` }; })
    );
  }
  return recordCache.get(file);
}

function resolvePath(obj, path) {
  let cur = obj;
  for (const part of path.split(".")) {
    if (cur == null || typeof cur !== "object") return null;
    cur = cur[part];
  }
  return cur === undefined ? null : cur;
}

// ---------------------------------------------------------------------------
// Concept resolution — the JS twin of field_coverage.concept_value, and held
// to it by tests/test_dashboard_concept_rows.py. "Filled" is not truthiness
// (0 is a declared amount, false a real answer); a path is relative to
// `normalized` and falls back to the record root for the hoisted sections; a
// list met mid-path fans out over its entries; a concept's mapping may be a
// list of alternative paths, first filled one wins.
// ---------------------------------------------------------------------------

const ROOT_SECTIONS = new Set(["kandidatavimas"]);

function isFilledValue(v) {
  if (v == null) return false;
  if (typeof v === "string") return v.trim() !== "";
  if (Array.isArray(v)) return v.length > 0;
  if (typeof v === "object") return Object.keys(v).length > 0;
  return true;
}

function walkValue(root, segments) {
  if (!segments.length) return isFilledValue(root) ? root : null;
  if (Array.isArray(root)) {
    for (const entry of root) {
      const value = walkValue(entry, segments);
      if (value != null) return value;
    }
    return null;
  }
  if (root == null || typeof root !== "object" || !(segments[0] in root)) return null;
  return walkValue(root[segments[0]], segments.slice(1));
}

// {mapped, value}: mapped=false means the concept map lists no path for this
// election — the form never asked — which the table shows apart from an
// answer the form invited and did not get.
function resolveConcept(record, electionId, conceptId) {
  const spec = CONCEPTS[conceptId];
  const mapping = spec && spec.paths ? spec.paths[electionId] : null;
  if (mapping == null) return { mapped: false, value: null };
  const paths = Array.isArray(mapping) ? mapping : [mapping];
  for (const path of paths) {
    const segments = path.split(".");
    let value = walkValue(record.normalized || {}, segments);
    if (value == null && ROOT_SECTIONS.has(segments[0])) value = walkValue(record, segments);
    if (value != null) return { mapped: true, value };
  }
  return { mapped: true, value: null };
}

// Resolve one comparison row against one record: the row's concept, then its
// era-fallback concepts. A derived row resolves nothing here — its formatter
// reads the whole record.
function resolveRow(row, record, electionId) {
  if (row.derived) return { mapped: true, value: null };
  let mapped = false;
  for (const conceptId of [row.concept, ...(row.fallbacks || [])]) {
    const res = resolveConcept(record, electionId, conceptId);
    mapped = mapped || res.mapped;
    if (res.value != null) return { mapped: true, value: res.value };
  }
  return { mapped, value: null };
}

function rowLabel(row) {
  return row.label || CONCEPT_LABELS[row.concept] || deslug(row.concept);
}

function compactValue(v) {
  if (v == null || v === "") return null;
  if (typeof v === "boolean") return v ? "taip" : "ne";
  if (typeof v !== "object") return String(v);
  if (Array.isArray(v)) {
    const parts = v.map(compactValue).filter(Boolean);
    return parts.length ? parts.join("; ") : null;
  }
  const parts = Object.entries(v)
    .map(([k, x]) => { const c = compactValue(x); return c == null ? null : `${labelFor(k)}: ${c}`; })
    .filter(Boolean);
  return parts.length ? parts.join("; ") : null;
}

// Source links out of a `nuorodos` list — only http(s), textContent only.
function appendSourceLinks(dd, nuorodos) {
  for (const url of Array.isArray(nuorodos) ? nuorodos : []) {
    if (typeof url !== "string" || !/^https?:\/\//.test(url)) continue;
    dd.appendChild(document.createTextNode(" "));
    const a = document.createElement("a");
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = "šaltinis";
    dd.appendChild(a);
  }
}

function renderValue(v) {
  if (v == null || v === "") { const s = document.createElement("span"); s.textContent = "—"; s.style.color = "var(--muted)"; return s; }
  if (typeof v === "boolean") { const s = document.createElement("span"); s.textContent = v ? "taip" : "ne"; return s; }
  if (typeof v !== "object") { const s = document.createElement("span"); s.textContent = String(v); return s; }
  if (Array.isArray(v)) {
    if (v.every(x => x == null || typeof x !== "object")) {
      const s = document.createElement("span"); s.textContent = v.filter(x => x != null).join("; ") || "—"; return s;
    }
    const keys = [...new Set(v.flatMap(x => (x && typeof x === "object" && !Array.isArray(x)) ? Object.keys(x) : []))];
    const t = document.createElement("table"); t.className = "rec";
    t.innerHTML = "<thead><tr></tr></thead><tbody></tbody>";
    for (const k of keys) { const th = document.createElement("th"); th.textContent = labelFor(k); t.tHead.rows[0].appendChild(th); }
    for (const item of v) {
      const tr = t.tBodies[0].insertRow();
      for (const k of keys) tr.insertCell().appendChild(renderValue(item && typeof item === "object" ? item[k] : item));
    }
    return t;
  }
  const dl = document.createElement("dl");
  for (const [k, x] of Object.entries(v)) {
    if (k === "nuotrauka") continue; // rendered as the header photo instead
    const dt = document.createElement("dt");
    const dd = document.createElement("dd");
    // profilis.kita entries print their own page label; use it over the slug.
    if (x && typeof x === "object" && !Array.isArray(x)
        && typeof x.pavadinimas === "string" && "reiksme" in x) {
      dt.textContent = x.pavadinimas;
      dd.appendChild(renderValue(x.reiksme));
      appendSourceLinks(dd, x.nuorodos);
    } else {
      dt.textContent = labelFor(k);
      dd.appendChild(renderValue(x));
    }
    dl.append(dt, dd);
  }
  return dl;
}

// A record that would not load, said out loud. Every view that fetches
// records uses this one: the comparison view used to drop failures on the
// floor (`records.filter(([, r]) => !r._error)`) and render 16 rows of em
// dashes over them, so a reader concluded those people had answered nothing
// — and the two index-derived rows above still looked authoritative. Neither
// the trailing-slash bug nor a data-less checkout is hypothetical; both
// produce exactly that page (issue #148).
function failureBanner(failed) {
  if (!failed.length) return null;
  const warn = document.createElement("div");
  warn.setAttribute("role", "alert");
  warn.style.cssText = "background:#fdf0ee;border:1px solid #e5b8b0;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;";
  warn.textContent =
    `Nepavyko įkelti ${failed.length} ${plural(failed.length, "įrašo", "įrašų", "įrašų")} — ` +
    "ar serveris paleistas iš saugyklos šaknies, šalia data/? " +
    "Žemiau rodomi tik įkelti įrašai, o tušti langeliai nereiškia, kad nebuvo atsakyta. " +
    failed.map(([, r]) => r._error).join(" · ");
  return warn;
}

function partyNameOf(e) {
  if (!e.p) return null;
  return (INDEX.parties[e.p] || {}).n || e.p;
}

function clearActiveRows() {
  for (const el of document.querySelectorAll(".row")) el.classList.remove("active");
}

async function showPerson(p) {
  location.hash = p.pid;
  for (const el of document.querySelectorAll(".row")) el.classList.toggle("active", el.dataset.key === p.pid);
  const root = document.getElementById("person");
  root.innerHTML = `<div class="loading">Kraunami įrašai (${p.e.length})…</div>`;
  const records = await Promise.all(p.e.map(e => fetchRecord(e).then(r => [e, r])));
  const loaded = records.filter(([, r]) => !r._error);
  const failed = records.filter(([, r]) => r._error);

  root.innerHTML = "";
  const banner = failureBanner(failed);
  if (banner) root.appendChild(banner);
  const head = document.createElement("div"); head.className = "phead";
  // The newest election's portrait, not the oldest: people age, and the
  // recent photo is the one a reader recognises. Three shapes are accepted:
  // the externalized sidecar (photos/<id>.<ext>, resolved against the
  // election dir — every archived portrait since issue #118, whether the
  // page embedded it or linked it), VRK's own hosted URL (what a record
  // keeps when the fetch failed: 38 records, on hosts that no longer serve
  // them, so the error handler below usually removes these) and a legacy
  // inline data: URI from a pre-externalization corpus.
  for (const [e, r] of [...loaded].reverse()) {
    const photo = resolvePath(r, "rawData.profile.photoSrc") || resolvePath(r, "normalized.profilis.nuotrauka");
    if (typeof photo !== "string" || !photo) continue;
    const img = document.createElement("img");
    img.loading = "lazy";
    img.alt = "";
    img.addEventListener("error", () => img.remove());
    if (photo.startsWith("photos/")) img.src = `../data/${e.id}/${photo}`;
    else if (/^https?:\/\//.test(photo)) img.src = photo;
    else if (photo.startsWith("data:")) img.src = photo;
    else continue;
    head.appendChild(img);
    break;
  }
  const hd = document.createElement("div");
  const h2 = document.createElement("h2"); h2.textContent = p.n;
  const meta = document.createElement("div"); meta.className = "meta";
  const won = p.e.filter(e => e.w === true).length;
  const unknown = p.e.filter(e => e.w === undefined).length;
  meta.textContent = (p.b ? `Gimė ${p.b} · ` : "Gimimo data nežinoma · ") +
    `rinkimų: ${p.e.length}, laimėta: ${won}` +
    (unknown ? `, be rezultatų duomenų: ${unknown}` : "");
  hd.append(h2, meta);
  // Who fielded them, across their whole run — distinct canonical nominator
  // names in first-appearance order, so a party switch reads as one.
  const partyIds = [...new Set(p.e.map(e => e.p).filter(Boolean))];
  if (partyIds.length) {
    const parties = document.createElement("div");
    parties.className = "meta";
    parties.textContent = partyIds.map(id => (INDEX.parties[id] || {}).n || id).join(" → ");
    hd.appendChild(parties);
  }
  head.appendChild(hd); root.appendChild(head);

  const tabs = document.createElement("div"); tabs.className = "tabs";
  root.appendChild(tabs);

  const paneE = document.createElement("div");
  for (const [e, r] of records) {
    const card = document.createElement("details"); card.className = "ecard";
    if (records.length <= 3) card.open = true;
    const sum = document.createElement("summary");
    sum.textContent = electionName(e.id);
    const partyName = partyNameOf(e);
    if (partyName) {
      const party = document.createElement("span"); party.className = "party";
      party.textContent = partyName;
      sum.appendChild(party);
    }
    // The showing (issue #133): the preference votes on the list, the votes
    // of the single-winner race's last round, whichever the record has.
    const showing = [
      e.v != null ? `${fmtInt(e.v)} ${plural(e.v, "pirmumo balsas", "pirmumo balsai", "pirmumo balsų")}` : null,
      e.cv != null ? `${fmtInt(e.cv)} ${plural(e.cv, "balsas", "balsai", "balsų")} apygardoje` : null,
    ].filter(Boolean);
    if (showing.length) {
      const votes = document.createElement("span"); votes.className = "party";
      votes.textContent = showing.join(" · ");
      sum.appendChild(votes);
    }
    if (e.w === true) {
      const win = document.createElement("span"); win.className = "win";
      // A council-and-mayor candidacy says which office was won.
      win.textContent = "✓ išrinktas (-a)" + (rolesOf(e).length > 1 ? `: ${electedLabel(e)}` : "");
      sum.appendChild(win);
    }
    else if (e.w === undefined) { const na = document.createElement("span"); na.className = "nores"; na.textContent = "rezultatų duomenų nėra"; sum.appendChild(na); }
    card.appendChild(sum);
    const body = document.createElement("div"); body.className = "body";
    if (r._error) {
      const err = document.createElement("div"); err.className = "sec";
      err.textContent = `Nepavyko įkelti: ${r._error}`;
      body.appendChild(err);
    } else {
      const sections = Object.entries(r.normalized || {});
      // The root kandidatavimas — the pre-2016 candidacy block — never
      // rendered anywhere: both panes iterated `normalized` alone (issue
      // #87). The archive families keep theirs inside normalized, so only
      // the root-held one needs appending.
      if (r.kandidatavimas && typeof r.kandidatavimas === "object" && !(r.normalized || {}).kandidatavimas) {
        sections.push(["kandidatavimas", r.kandidatavimas]);
      }
      for (const [sec, val] of sections) {
        const wrap = document.createElement("div"); wrap.className = "sec";
        const h = document.createElement("h4"); h.textContent = labelFor(sec);
        wrap.appendChild(h); wrap.appendChild(renderValue(val));
        body.appendChild(wrap);
      }
    }
    card.appendChild(body); paneE.appendChild(card);
  }

  const paneC = document.createElement("div");
  const cmpWrap = document.createElement("div"); cmpWrap.className = "tablewrap";
  const cmp = document.createElement("table"); cmp.className = "cmp";
  cmp.innerHTML = "<thead><tr><th>Laukas</th></tr></thead><tbody></tbody>";
  for (const [e] of loaded) {
    const th = document.createElement("th");
    th.textContent = electionShortName(e.id);
    th.title = electionName(e.id);
    cmp.tHead.rows[0].appendChild(th);
  }
  for (const row of CONCEPT_ROWS) {
    const tr = cmp.tBodies[0].insertRow();
    const th = document.createElement("th"); th.textContent = rowLabel(row); tr.appendChild(th);
    for (const [e, r] of loaded) {
      const { mapped, value } = resolveRow(row, r, e.id);
      const v = value;
      const format = row.format;
      const td = tr.insertCell();
      const c = format ? format(v, r) : compactValue(v);
      td.textContent = c == null ? "—" : c;
      if (c == null) {
        td.className = mapped ? "null" : "null unmapped";
        if (!mapped) td.title = "Šių rinkimų anketa šio lauko neskelbė";
      }
      else if (format === moneyCell) td.style.fontVariantNumeric = "tabular-nums";
    }
  }
  cmpWrap.appendChild(cmp);
  paneC.appendChild(cmpWrap);

  const paneA = buildAssetPane(loaded, failed.length);

  const panes = [
    ["Rinkimai ir atsakymai", paneE],
    ["Turtas ir pajamos", paneA],
    ["Palyginimas tarp rinkimų", paneC],
  ];
  for (const [label, pane] of panes) {
    const btn = document.createElement("button");
    btn.textContent = label;
    btn.addEventListener("click", () => {
      for (const [, other] of panes) other.style.display = "none";
      for (const b of tabs.children) b.className = "";
      pane.style.display = ""; btn.className = "on";
    });
    tabs.appendChild(btn);
    pane.style.display = "none";
    root.appendChild(pane);
  }
  tabs.children[0].className = "on";
  paneE.style.display = "";
}

// ---------------------------------------------------------------------------
// Side-by-side comparison of hand-picked persons (issue #87) — the project's
// own goal sentence, previously absent. Columns are persons; every concept
// row shows each person's newest resolving answer, tagged with its election.
// ---------------------------------------------------------------------------

async function showCompare() {
  const persons = [...compareSet.values()];
  if (persons.length < 2) return;
  location.hash = "";
  clearActiveRows();
  const root = document.getElementById("person");
  const total = persons.reduce((n, p) => n + p.e.length, 0);
  root.innerHTML = `<div class="loading">Kraunami įrašai (${total})…</div>`;
  const perPerson = await Promise.all(persons.map(async p => {
    const records = await Promise.all(p.e.map(e => fetchRecord(e).then(r => [e, r])));
    return [p, records.filter(([, r]) => !r._error), records.filter(([, r]) => r._error)];
  }));
  const failed = perPerson.flatMap(([, , bad]) => bad);

  root.innerHTML = "";
  const h2 = document.createElement("h2");
  h2.style.cssText = "margin:0 0 4px;font-size:20px";
  h2.textContent = "Asmenų palyginimas";
  root.appendChild(h2);
  const compareBanner = failureBanner(failed);
  if (compareBanner) root.appendChild(compareBanner);
  const note = document.createElement("div");
  note.className = "aggnote";
  note.textContent = "Kiekviename langelyje — naujausias to asmens atsakymas ir rinkimai, kuriuose jis pateiktas.";
  root.appendChild(note);

  const wrap = document.createElement("div"); wrap.className = "tablewrap";
  const t = document.createElement("table"); t.className = "cmp";
  t.innerHTML = "<thead><tr><th>Laukas</th></tr></thead><tbody></tbody>";
  for (const [p] of perPerson) {
    const th = document.createElement("th");
    th.textContent = `${p.n}\n${p.b || "gimimo data nežinoma"}`;
    t.tHead.rows[0].appendChild(th);
  }

  const infoRow = (label, fill) => {
    const tr = t.tBodies[0].insertRow();
    const th = document.createElement("th"); th.textContent = label; tr.appendChild(th);
    for (const [p, records] of perPerson) {
      const td = tr.insertCell();
      const c = fill(p, records);
      td.textContent = c == null ? "—" : c;
      if (c == null) td.className = "null";
    }
  };
  infoRow("Rinkimų / laimėta", (p) => {
    const won = p.e.filter(e => e.w === true).length;
    const unknown = p.e.filter(e => e.w === undefined).length;
    return `${p.e.length} / ${won}` + (unknown ? ` (be duomenų: ${unknown})` : "");
  });
  infoRow("Iškėlusios partijos", (p) => {
    const ids = [...new Set(p.e.map(e => e.p).filter(Boolean))];
    return ids.length ? ids.map(id => (INDEX.parties[id] || {}).n || id).join("\n") : null;
  });

  for (const row of CONCEPT_ROWS) {
    const tr = t.tBodies[0].insertRow();
    const th = document.createElement("th"); th.textContent = rowLabel(row); tr.appendChild(th);
    for (const [, records] of perPerson) {
      const td = tr.insertCell();
      let cell = null;
      for (const [e, r] of [...records].reverse()) {
        const { value } = resolveRow(row, r, e.id);
        const c = row.format ? row.format(value, r) : compactValue(value);
        // "Neklausta" is a real answer state but not this person's answer —
        // keep scanning back for an election that asked.
        if (c == null || c === "Neklausta") continue;
        cell = `${c}\n(${electionShortName(e.id)})`;
        break;
      }
      td.textContent = cell == null ? "—" : cell;
      if (cell == null) td.className = "null";
      else if (row.format === moneyCell) td.style.fontVariantNumeric = "tabular-nums";
    }
  }
  wrap.appendChild(t);
  root.appendChild(wrap);
}

// ---------------------------------------------------------------------------
// Per-election aggregates (issue #87): party mix, education mix, money
// medians — every figure with its denominator printed beside it, because the
// higher-education share alone swings up to 28.9 points on that choice.
// Everything computes from people.json; no record fetches.
// ---------------------------------------------------------------------------

function median(values) {
  if (!values.length) return null;
  const sorted = [...values].sort((a, b) => a - b);
  const mid = sorted.length >> 1;
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

const pct = (part, whole) => whole ? `${(100 * part / whole).toFixed(1).replace(".", ",")} %` : "—";

// Which sidebar facets a header view is honouring, in words (issue #148).
// `showAggregates` used to copy exactly one facet across — the election — and
// then walk every person unconditionally, while `showMovers` read none at
// all: with 2024 Seimas + LSDP + "tik išrinkti" the list said "rasta 52" and
// the summary reported the whole election's 1,740 / 141, with the three
// selects still showing the filters and nothing saying two had been dropped.
// Both views apply them now, and both name them.
const FACET_LABELS = [
  ["party", "fParty", "iškėlėjas"],
  ["municipality", "fMunicipality", "savivaldybė"],
  ["constituency", "fConstituency", "apygarda"],
  ["role", "fRole", "pareigos"],
  ["won", "fWon", "rezultatas"],
];

function facetNote(f, { withElection = false } = {}) {
  const named = [];
  if (withElection && f.election) {
    named.push(`rinkimai: ${electionShortName(f.election)}`);
  }
  for (const [key, selectId, label] of FACET_LABELS) {
    const value = f[key];
    if (!value) continue;
    const select = document.getElementById(selectId);
    const text = select && select.selectedOptions[0] ? select.selectedOptions[0].textContent : value;
    named.push(`${label}: ${text}`);
  }
  return named;
}

// The facet set a header view scopes by: everything the sidebar has, with
// the election taken from the view's own picker.
function scopedFilters(electionId) {
  const f = activeFilters();
  return { ...f, election: electionId, any: true };
}

function appendFacetNote(root, named, onClear) {
  // Nothing when nothing is filtered: the absence of this line is the
  // default and is not a claim, and repeating "no filters applied" on every
  // render is noise. It appears exactly when the numbers are narrower than
  // the heading suggests.
  if (!named.length) return;
  const line = document.createElement("div");
  line.className = "aggnote";
  line.append(document.createTextNode(
    `Taikomi šoniniai filtrai (${named.join("; ")}) — skaičiai apskaičiuoti tik iš jų atitinkančių kandidatavimų. `
  ));
  const clear = document.createElement("button");
