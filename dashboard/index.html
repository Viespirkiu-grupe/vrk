<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRK kandidatų naršyklė</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #1c1c1a; --muted: #6d6d68;
    --line: #e3e3de; --accent: #2456a4; --accent-soft: #eef2f9; --win: #22713c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); overflow: hidden; display: flex; flex-direction: column; }
  header { padding: 14px 22px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  header .stats { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 0; flex: 1; min-height: 0; }
  #left { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #searchbox { padding: 12px; border-bottom: 1px solid var(--line); }
  #search { width: 100%; padding: 9px 12px; font-size: 15px; border: 1px solid var(--line); border-radius: 8px; }
  #filters { padding: 6px 12px 10px; font-size: 13px; color: var(--muted); display: flex; gap: 14px; border-bottom: 1px solid var(--line); }
  #count { margin-left: auto; }
  #results { overflow-y: auto; flex: 1; }
  .row { padding: 8px 14px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  .row:hover, .row.active { background: var(--accent-soft); }
  .row .nm { font-weight: 500; }
  .row .bd { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .row .cnt { color: var(--accent); font-size: 12.5px; white-space: nowrap; }
  #person { padding: 22px 28px; overflow-y: auto; }
  #person .placeholder { color: var(--muted); margin-top: 40px; text-align: center; }
  .phead { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 18px; }
  .phead img { width: 92px; border-radius: 8px; border: 1px solid var(--line); }
  .phead h2 { margin: 0 0 4px; font-size: 22px; }
  .phead .meta { color: var(--muted); }
  .tabs { display: flex; gap: 6px; margin: 14px 0; }
  .tabs button { padding: 7px 14px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; cursor: pointer; font-size: 14px; }
  .tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ecard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
  .ecard > summary { padding: 12px 16px; cursor: pointer; font-weight: 600; list-style: none; display: flex; gap: 10px; align-items: baseline; }
  .ecard > summary::-webkit-details-marker { display: none; }
  .ecard .win { color: var(--win); font-size: 13px; font-weight: 500; }
  .ecard .body { padding: 4px 16px 14px; border-top: 1px solid var(--line); }
  .sec { margin: 12px 0; }
  .sec h4 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  dl { margin: 0; display: grid; grid-template-columns: 260px 1fr; gap: 3px 14px; }
  dt { color: var(--muted); overflow-wrap: anywhere; }
  dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  table.rec { border-collapse: collapse; font-size: 13.5px; margin: 4px 0; max-width: 100%; display: block; overflow-x: auto; }
  table.rec th, table.rec td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; min-width: 110px; }
  table.rec th { background: var(--accent-soft); font-weight: 600; }
  table.cmp { border-collapse: collapse; width: 100%; font-size: 13.5px; background: var(--panel); }
  table.cmp th, table.cmp td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; white-space: pre-line; }
  table.cmp thead th { background: var(--accent-soft); position: sticky; top: 0; }
  table.cmp td.null { color: var(--muted); }
  .loading { color: var(--muted); padding: 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } #left { max-height: 45vh; } }
</style>
</head>
<body>
<header>
  <h1>VRK kandidatų naršyklė</h1>
  <span class="stats" id="topstats">kraunamas indeksas…</span>
  <button id="moversBtn" style="margin-left:auto;padding:6px 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;font-size:13.5px">📈 Didžiausi pokyčiai</button>
</header>
<main>
  <div id="left">
    <div id="searchbox"><input id="search" type="search" placeholder="Ieškokite asmens… (pvz., Puidokas)" autofocus></div>
    <div id="filters"><span id="count"></span></div>
    <div id="results"></div>
  </div>
  <div id="person"><div class="placeholder">Pasirinkite asmenį — matysite rinkimus ir anketų atsakymus.</div></div>
</main>
<script>
"use strict";

// Election names come from people.json, which copies them from the one
// registry (scraper/elections.json). No election list lives in this file:
// three hand-maintained copies is what let 2011-vasario-27-savivaldybiu and
// six others ship as raw slugs (issue #63). An id the registry does not know
// falls back to itself, and the builder reports it.
let ELECTIONS = new Map();

const electionName = (id) => (ELECTIONS.get(id) || {}).name || id;
const electionShortName = (id) => (ELECTIONS.get(id) || {}).shortName || id;

// Money series for the assets & income chart. The first three are the keys
// every election from 2007 on declares under. The fourth exists because the
// 1996-1997 form does not split turtas from piniginės lėšos -- it publishes
// one summed figure -- so those elections leave the first two null and would
// otherwise chart no turtas at all, despite the page stating it. It is a
// different measure, not a fallback, so it gets its own series rather than
// being folded into the first.
// ORDER MATTERS: it is the order of MONEY_FIELDS in
// scripts/build_person_index.py, which people.json's "m" array follows and
// the Biggest movers picker indexes into.
const MONEY_SERIES = [
  ["Privalomas registruoti turtas", "turto-ir-pajamu-deklaracijos.privalomas-registruoti-turtas", "#2456a4"],
  ["Piniginės lėšos", "turto-ir-pajamu-deklaracijos.pinigines-lesos", "#7fa8d9"],
  ["Gautos pajamos", "turto-ir-pajamu-deklaracijos.gautos-pajamos", "#2c8a4b"],
  ["Turtas ir piniginės lėšos (metų pabaigoje)", "turto-ir-pajamu-deklaracijos.turtas-ir-pinigines-lesos-metu-pabaigoje", "#b5761f"],
];

// Render a declared figure the way the assets pane does: litas converted at
// the changeover rate and formatted as euro. Without this the compare table
// printed the stored number raw, so a 2008 income sat next to a 2024 one
// 3.4528x too large and unlabelled -- half the corpus declares in litas.
// A function declaration, so FIELD_MAP below can reference it.
function moneyCell(value, record) {
  const n = parseMoney(value);
  if (n == null) return null;
  return fmtEUR(declaredInLitas(record) ? n / LITAS_PER_EURO : n);
}

// Education is an object -- {aprasas, irasai:[{issilavinimas,
// mokymo-istaigos-pavadinimas, specialybe, baigimo-metai}]} -- so the generic
// compactValue() rendered it as "irasai: issilavinimas: Aukštasis;
// mokymo-istaigos-pavadinimas: ..." across every column. One line per entry
// reads as what it is. (The 1997 municipal archive published a bare level
// string and is reshaped into this same object by
// scripts/reshape_1997_education.py, so there is one shape to render.)
function educationCell(value) {
  if (value == null || value === "") return null;
  if (typeof value !== "object") return String(value);
  const lines = (value.irasai || []).map((entry) => {
    const where = [entry["mokymo-istaigos-pavadinimas"], entry["specialybe"]].filter(Boolean).join(", ");
    const year = entry["baigimo-metai"] ? ` (${entry["baigimo-metai"]})` : "";
    return [entry.issilavinimas, where && `${where}${year}`].filter(Boolean).join(" — ")
        || (year ? year.trim() : "");
  }).filter(Boolean);
  if (value.aprasas) lines.unshift(value.aprasas);
  return lines.length ? lines.join("\n") : null;
}

// A criminal conviction is published in three shapes across the corpus -- a
// structured detail table (2016 on), a free-text explanation (2000-2015), and
// a bare yes/no -- so the compare row used to print the yes/no alone and lose
// the substance. This mirrors scraper/shared/conviction_details.teistumas():
// the same four states, resolved the same way. "Neklausta" is printed rather
// than left blank because a question VRK never asked is not a denial, and the
// two used to render identically.
// Each question is worded to suit its own paragraph, and the answer follows the
// wording: Taip/Ne, Yra/Nėra, Buvo/Nebuvo, Turiu/Neturiu.
const AFFIRMATIVE_ANSWERS = ["taip", "yra", "buvo", "turiu"];
const isAffirmative = (v) => typeof v === "string" && AFFIRMATIVE_ANSWERS.includes(v.trim().toLowerCase());

const RELATED_DECLARATIONS = {
  "ar-buvote-pripazintas-kaltu-del-sunkaus-nusikaltimo": "sunkus nusikaltimas",
  "ar-buvote-pripazintas-kaltu-uzsienyje": "užsienio teismas",
  "ar-buvote-pripazintas-kaltu-uzsienyje-del-politinio-persekiojimo": "užsienio teismas, politinis persekiojimas",
  "ar-buvote-pripazintas-kaltu-del-politinio-persekiojimo": "politinis persekiojimas",
  "ar-nebaigta-teismo-paskirta-bausme": "neatlikta bausmė",
};

function convictionCell(_value, record) {
  const anketa = (record.normalized || {}).anketa || {};
  const pareiskimai = anketa["pareiskimai"] || {};
  const declaration = pareiskimai["ar-buvote-pripazintas-kaltu"];
  const freeText = pareiskimai["teisiniai-argumentai"] || null;
  const entries = ((anketa["teistumo-detales"] || {}).irasai || []).filter(e => e && typeof e === "object");
  const declared = isAffirmative(declaration);
  // The neighbouring paragraphs of the 2000-2014 forms: a different question,
  // so it does not turn a "Ne" into a "Taip", but 20 records in the corpus
  // declare a conviction there and deny the main question, and printing the
  // "Ne" alone calls all 20 unconvicted.
  const related = Object.entries(RELATED_DECLARATIONS)
    .filter(([key]) => isAffirmative(pareiskimai[key]))
    .map(([, label]) => label);

  if (typeof declaration !== "string" || !declaration.trim()) {
    if (entries.length) return convictionLines(declaration, entries, freeText, related);
    return related.length ? ["Neklausta", `Taip: ${related.join("; ")}`].join("\n") : "Neklausta";
  }
  if (!declared) {
    return related.length ? [declaration, `Taip: ${related.join("; ")}`].join("\n") : declaration;
  }
  if (!entries.length && !freeText) {
    return convictionLines(`${declaration} — detalių nepaskelbta`, [], null, related);
  }
  return convictionLines(declaration, entries, freeText, related);
}


// The offence sits under one name in the 2016-2021 tables and another inside
// the nested offence records of the Rinkimų kodekso block.
const OFFENCE_KEYS = ["nusikalstama-veika", "kesinimosi-objektas-baudziamojo-kodekso-skyriaus-ir-straipsnio-pavadinimas"];

function convictionLines(declaration, entries, freeText, related) {
  const lines = [declaration];
  for (const entry of entries) {
    const offences = [entry, ...(entry["nusikalstamos-veikos"] || [])]
      .filter(o => o && typeof o === "object")
      .flatMap(o => OFFENCE_KEYS.map(k => o[k]).filter(v => typeof v === "string" && v));
    const where = [entry["nuosprendzio-data"], entry["nuosprendzio-institucija"]].filter(Boolean).join(", ");
    lines.push([where, offences.join("; ")].filter(Boolean).join(" — ") || "—");
  }
  if (freeText) lines.push(freeText);
  if (related && related.length) lines.push(`Taip: ${related.join("; ")}`);
  return lines.join("\n");
}

// Comparison concepts: label -> normalized paths tried in order per election,
// plus an optional formatter (value, record) -> string for concepts a bare
// compactValue() renders wrongly.
const FIELD_MAP = [
  ["Einamos pareigos", ["anketa.einamos-pareigos"]],
  ["Pagrindinė darbovietė", ["anketa.pagrindine-darboviete"]],
  ["Išsilavinimas", ["anketa.issilavinimas", "biografija.issilavinimas"], educationCell],
  ["Šeiminė padėtis", ["anketa.seimine-padetis", "biografija.seimine-padetis"]],
  ["Užsienio kalbos", ["anketa.uzsienio-kalbos", "biografija.uzsienio-kalbos"]],
  ["Privalomas registruoti turtas", ["turto-ir-pajamu-deklaracijos.privalomas-registruoti-turtas"], moneyCell],
  ["Piniginės lėšos", ["turto-ir-pajamu-deklaracijos.pinigines-lesos"], moneyCell],
  ["Gautos pajamos", ["turto-ir-pajamu-deklaracijos.gautos-pajamos"], moneyCell],
  // 1996-1997 only: that form sums turtas and piniginės lėšos, and prints
  // employment income separately from the total. On the 1997 municipal
  // election the total is usually unusable, so the employment row is the only
  // income figure those records have -- without this row they read as blank.
  ["Turtas ir piniginės lėšos (metų pabaigoje)", ["turto-ir-pajamu-deklaracijos.turtas-ir-pinigines-lesos-metu-pabaigoje"], moneyCell],
  ["Turtas ir piniginės lėšos (metų pradžioje)", ["turto-ir-pajamu-deklaracijos.turtas-ir-pinigines-lesos-metu-pradzioje"], moneyCell],
  ["Per metus įsigytas turtas", ["turto-ir-pajamu-deklaracijos.kalendoriniais-metais-isigytas-turtas"], moneyCell],
  ["Gautos pajamos (darbo santykiai)", ["turto-ir-pajamu-deklaracijos.gautos-pajamos-darbo-santykiu"], moneyCell],
  ["Teistumas", ["anketa.pareiskimai.ar-buvote-pripazintas-kaltu"], convictionCell],
];

let INDEX = null;
const recordCache = new Map();

const fold = (s) => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase();

// Lithuanian counts three integer forms -- 1 asmuo, 2 asmenys, 11 asmenų --
// on a rule that is not "n === 1", so pick them through Intl rather than by
// hand. ("many" is Lithuanian's fraction form; it falls back to the genitive.)
const PLURAL = new Intl.PluralRules("lt");
const plural = (n, one, few, rest) => ({ one, few, many: rest, other: rest })[PLURAL.select(n)];
const fmtInt = (n) => n.toLocaleString("lt-LT");

async function boot() {
  // The index changes after every corpus update; a cached stale copy makes
  // the app quietly disagree with the data on disk.
  const res = await fetch("people.json", { cache: "no-store" });
  INDEX = await res.json();
  ELECTIONS = new Map((INDEX.elections || []).map(e => [e.id, e]));
  const s = INDEX.stats;
  document.getElementById("topstats").textContent =
    `${fmtInt(s.persons)} ${plural(s.persons, "asmuo", "asmenys", "asmenų")} · ` +
    `${fmtInt(s.records)} ${plural(s.records, "kandidatavimas", "kandidatavimai", "kandidatavimų")} · ` +
    `${fmtInt(s.personsInMultipleElections)} dalyvavo 2+ rinkimuose`;
  for (const p of INDEX.people) p._f = fold(p.n);
  document.getElementById("search").addEventListener("input", renderList);
  document.getElementById("moversBtn").addEventListener("click", showMovers);
  renderList();
  const hashKey = decodeURIComponent(location.hash.slice(1));
  if (hashKey) { const p = INDEX.people.find(p => p.k === hashKey); if (p) showPerson(p); }
}

// Matching stops at MATCH_CAP so a bare search does not walk all 47k people;
// only the first RENDER_LIMIT rows are built. The count says both numbers --
// it used to report the match count alone ("5,000+ shown") while 300 rows
// existed, which read as a claim about what was on screen.
const MATCH_CAP = 5000;
const RENDER_LIMIT = 300;

function renderList() {
  const q = fold(document.getElementById("search").value.trim());
  const out = [];
  for (const p of INDEX.people) {
    if (q && !p._f.includes(q)) continue;
    out.push(p);
    if (out.length >= MATCH_CAP) break;
  }
  const capped = out.length >= MATCH_CAP;
  const shown = Math.min(out.length, RENDER_LIMIT);
  document.getElementById("count").textContent =
    shown < out.length
      ? `rasta ${fmtInt(out.length)}${capped ? "+" : ""} · rodoma ${fmtInt(shown)}`
      : `rasta ${fmtInt(out.length)}`;
  const frag = document.createDocumentFragment();
  for (const p of out.slice(0, RENDER_LIMIT)) {
    const div = document.createElement("div");
    div.className = "row";
    div.dataset.key = p.k;
    div.innerHTML = `<span><span class="nm"></span> <span class="bd"></span></span>` +
      `<span class="cnt">Rinkimų: ${p.e.length}</span>`;
    div.querySelector(".nm").textContent = p.n;
    div.querySelector(".bd").textContent = p.b ? `· ${p.b}` : "· gimimo data nežinoma";
    div.addEventListener("click", () => showPerson(p));
    frag.appendChild(div);
  }
  const results = document.getElementById("results");
  results.replaceChildren(frag);
}

function recordFile(e) {
  return `data/${e.id}/${e.c}-${e.id}.json`;
}

// A failed record must degrade to an error note on its card — never hang the
// whole person page (one 404 used to reject the Promise.all silently).
//
// no-store for the same reason people.json uses it, and it is not theoretical:
// records are rewritten in place when a parser gains a field — the 1996-1997
// declarations were backfilled into existing files — and a browser holding the
// pre-backfill copy showed empty asset rows against a corpus that had the
// figures, with no way to tell the difference from "never declared".
async function fetchRecord(e) {
  const file = recordFile(e);
  if (!recordCache.has(file)) {
    recordCache.set(
      file,
      fetch("../" + file, { cache: "no-store" })
        .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
        .catch(err => { recordCache.delete(file); return { _error: `${file}: ${err.message || err}` }; })
    );
  }
  return recordCache.get(file);
}

function resolvePath(obj, path) {
  let cur = obj;
  for (const part of path.split(".")) {
    if (cur == null || typeof cur !== "object") return null;
    cur = cur[part];
  }
  return cur === undefined ? null : cur;
}

function compactValue(v) {
  if (v == null || v === "") return null;
  if (typeof v !== "object") return String(v);
  if (Array.isArray(v)) {
    const parts = v.map(compactValue).filter(Boolean);
    return parts.length ? parts.join("; ") : null;
  }
  const parts = Object.entries(v)
    .map(([k, x]) => { const c = compactValue(x); return c == null ? null : `${k}: ${c}`; })
    .filter(Boolean);
  return parts.length ? parts.join("; ") : null;
}

function renderValue(v) {
  if (v == null || v === "") { const s = document.createElement("span"); s.textContent = "—"; s.style.color = "var(--muted)"; return s; }
  if (typeof v !== "object") { const s = document.createElement("span"); s.textContent = String(v); return s; }
  if (Array.isArray(v)) {
    if (v.every(x => x == null || typeof x !== "object")) {
      const s = document.createElement("span"); s.textContent = v.filter(x => x != null).join("; ") || "—"; return s;
    }
    const keys = [...new Set(v.flatMap(x => (x && typeof x === "object" && !Array.isArray(x)) ? Object.keys(x) : []))];
    const t = document.createElement("table"); t.className = "rec";
    t.innerHTML = "<thead><tr></tr></thead><tbody></tbody>";
    for (const k of keys) { const th = document.createElement("th"); th.textContent = k; t.tHead.rows[0].appendChild(th); }
    for (const item of v) {
      const tr = t.tBodies[0].insertRow();
      for (const k of keys) tr.insertCell().appendChild(renderValue(item && typeof item === "object" ? item[k] : item));
    }
    return t;
  }
  const dl = document.createElement("dl");
  for (const [k, x] of Object.entries(v)) {
    if (k === "nuotrauka") continue; // rendered as the header photo instead
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.appendChild(renderValue(x));
    dl.append(dt, dd);
  }
  return dl;
}

async function showPerson(p) {
  location.hash = encodeURIComponent(p.k);
  for (const el of document.querySelectorAll(".row")) el.classList.toggle("active", el.dataset.key === p.k);
  const root = document.getElementById("person");
  root.innerHTML = `<div class="loading">Kraunami įrašai (${p.e.length})…</div>`;
  const records = await Promise.all(p.e.map(e => fetchRecord(e).then(r => [e, r])));
  const loaded = records.filter(([, r]) => !r._error);
  const failed = records.filter(([, r]) => r._error);

  root.innerHTML = "";
  if (failed.length) {
    const warn = document.createElement("div");
    warn.style.cssText = "background:#fdf0ee;border:1px solid #e5b8b0;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;";
    warn.textContent =
      `Nepavyko įkelti ${failed.length} ${plural(failed.length, "įrašo", "įrašų", "įrašų")} — ` +
      "ar serveris paleistas iš saugyklos šaknies, šalia data/? " +
      failed.map(([, r]) => r._error).join(" · ");
    root.appendChild(warn);
  }
  const head = document.createElement("div"); head.className = "phead";
  for (const [e, r] of loaded) {
    // Photos are sidecar files since the externalization: both photo fields
    // carry "photos/<candidateId>.<ext>", resolved against the election dir.
    // Older corpora may still embed data: URIs; VRK URLs are not hotlinked.
    const photo = resolvePath(r, "rawData.profile.photoSrc") || resolvePath(r, "normalized.profilis.nuotrauka");
    if (!photo) continue;
    const img = document.createElement("img");
    if (photo.startsWith("photos/")) { img.src = `../data/${e.id}/${photo}`; head.appendChild(img); break; }
    if (photo.startsWith("data:")) { img.src = photo; head.appendChild(img); break; }
  }
  const hd = document.createElement("div");
  const h2 = document.createElement("h2"); h2.textContent = p.n;
  const meta = document.createElement("div"); meta.className = "meta";
  meta.textContent = (p.b ? `Gimė ${p.b} · ` : "Gimimo data nežinoma · ") +
    `rinkimų: ${p.e.length}, laimėta: ${p.e.filter(e => e.w).length}`;
  hd.append(h2, meta); head.appendChild(hd); root.appendChild(head);

  const tabs = document.createElement("div"); tabs.className = "tabs";
  root.appendChild(tabs);

  const paneE = document.createElement("div");
  for (const [e, r] of records) {
    const card = document.createElement("details"); card.className = "ecard";
    if (records.length <= 3) card.open = true;
    const sum = document.createElement("summary");
    sum.textContent = electionName(e.id);
    if (e.w) { const win = document.createElement("span"); win.className = "win"; win.textContent = "✓ išrinktas (-a)"; sum.appendChild(win); }
    card.appendChild(sum);
    const body = document.createElement("div"); body.className = "body";
    if (r._error) {
      const err = document.createElement("div"); err.className = "sec";
      err.textContent = `Nepavyko įkelti: ${r._error}`;
      body.appendChild(err);
    } else {
      for (const [sec, val] of Object.entries(r.normalized || {})) {
        const wrap = document.createElement("div"); wrap.className = "sec";
        const h = document.createElement("h4"); h.textContent = sec;
        wrap.appendChild(h); wrap.appendChild(renderValue(val));
        body.appendChild(wrap);
      }
    }
    card.appendChild(body); paneE.appendChild(card);
  }

  const paneC = document.createElement("div");
  const cmp = document.createElement("table"); cmp.className = "cmp";
  cmp.innerHTML = "<thead><tr><th>Laukas</th></tr></thead><tbody></tbody>";
  for (const [e] of loaded) {
    const th = document.createElement("th");
    th.textContent = electionName(e.id);
    cmp.tHead.rows[0].appendChild(th);
  }
  for (const [label, paths, format] of FIELD_MAP) {
    const tr = cmp.tBodies[0].insertRow();
    const th = document.createElement("th"); th.textContent = label; tr.appendChild(th);
    for (const [, r] of loaded) {
      let v = null;
      for (const path of paths) { v = resolvePath(r.normalized || {}, path); if (v != null && v !== "") break; }
      const td = tr.insertCell();
      const c = format ? format(v, r) : compactValue(v);
      td.textContent = c == null ? "—" : c;
      if (c == null) td.className = "null";
      else if (format === moneyCell) td.style.fontVariantNumeric = "tabular-nums";
    }
  }
  paneC.appendChild(cmp);

  const paneA = buildAssetPane(loaded);

  const panes = [
    ["Rinkimai ir atsakymai", paneE],
    ["Turtas ir pajamos", paneA],
    ["Palyginimas tarp rinkimų", paneC],
  ];
  for (const [label, pane] of panes) {
    const btn = document.createElement("button");
    btn.textContent = label;
    btn.addEventListener("click", () => {
      for (const [, other] of panes) other.style.display = "none";
      for (const b of tabs.children) b.className = "";
      pane.style.display = ""; btn.className = "on";
    });
    tabs.appendChild(btn);
    pane.style.display = "none";
    root.appendChild(pane);
  }
  tabs.children[0].className = "on";
  paneE.style.display = "";
}

function showMovers() {
  location.hash = "";
  for (const el of document.querySelectorAll(".row")) el.classList.remove("active");
  const root = document.getElementById("person");
  root.innerHTML = "";

  const bar = document.createElement("div");
  bar.style.cssText = "display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap";
  bar.innerHTML = `<h2 style="margin:0;font-size:20px">Didžiausi pokyčiai</h2>
    <select id="mvSeries" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px">
      ${MONEY_SERIES.map(([label], i) => `<option value="${i}">${label}</option>`).join("")}
    </select>
    <select id="mvDir" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px">
      <option value="desc">didžiausias padidėjimas</option>
      <option value="asc">didžiausias sumažėjimas</option>
    </select>
    <span class="stats" style="color:var(--muted);font-size:13px">pirma ir paskutinė deklaruota reikšmė; asmenys, ją deklaravę 2+ rinkimuose</span>`;
  root.appendChild(bar);
  const holder = document.createElement("div");
  root.appendChild(holder);

  function render() {
    const s = +document.getElementById("mvSeries").value;
    const dir = document.getElementById("mvDir").value;
    const rows = [];
    for (const p of INDEX.people) {
      const vals = p.e.filter(e => e.m && e.m[s] != null);
      if (vals.length < 2) continue;
      const first = vals[0], last = vals[vals.length - 1];
      if (first.id === last.id) continue;
      const delta = last.m[s] - first.m[s];
      if (delta === 0) continue;
      rows.push({ p, first, last, delta });
    }
    rows.sort((a, b) => dir === "desc" ? b.delta - a.delta : a.delta - b.delta);
    const t = document.createElement("table"); t.className = "cmp";
    t.innerHTML = `<thead><tr><th>#</th><th>Asmuo</th><th>Nuo</th><th>Iki</th><th>Δ</th></tr></thead><tbody></tbody>`;
    rows.slice(0, 100).forEach((r, i) => {
      const tr = t.tBodies[0].insertRow();
      tr.insertCell().textContent = String(i + 1);
      const nameCell = tr.insertCell();
      const a = document.createElement("a");
      a.href = "#" + encodeURIComponent(r.p.k);
      a.textContent = `${r.p.n} · ${r.p.b || "?"}`;
      a.addEventListener("click", (ev) => { ev.preventDefault(); showPerson(r.p); });
      nameCell.appendChild(a);
      const tag = (e) => electionShortName(e.id);
      tr.insertCell().textContent = `${fmtEUR(r.first.m[s])} (${tag(r.first)})`;
      tr.insertCell().textContent = `${fmtEUR(r.last.m[s])} (${tag(r.last)})`;
      const d = tr.insertCell();
      d.textContent = (r.delta > 0 ? "+" : "−") + fmtEUR(Math.abs(r.delta));
      d.style.color = r.delta > 0 ? "var(--win)" : "#a03325";
      d.style.fontVariantNumeric = "tabular-nums";
    });
    holder.replaceChildren(t);
  }
  document.getElementById("mvSeries").addEventListener("change", render);
  document.getElementById("mvDir").addEventListener("change", render);
  render();
}

function parseMoney(v) {
  if (v == null) return null;
  if (typeof v === "number") return Number.isFinite(v) ? v : null;
  if (typeof v !== "string") return null;
  const n = parseFloat(v.replace(/[€\s ]/g, "").replace(",", "."));
  return Number.isFinite(n) ? n : null;
}

// The 2012-2015 pages declare in litas (`valiuta: "Lt"`); converted at the
// irrevocable 2015 changeover rate so a person's series stays comparable.
// Mirrors scripts/build_person_index.py, which does the same for people.json.
const LITAS_PER_EURO = 3.4528;
function declaredInLitas(record) {
  const d = (record.normalized || {})["turto-ir-pajamu-deklaracijos"];
  return !!d && d.valiuta === "Lt";
}
function moneyEUR(record, path) {
  const v = parseMoney(resolvePath(record.normalized || {}, path));
  if (v == null) return null;
  return declaredInLitas(record) ? v / LITAS_PER_EURO : v;
}

const fmtEUR = (n) => n.toLocaleString("lt-LT", { maximumFractionDigits: 0 }) + " €";

function buildAssetPane(loaded) {
  const pane = document.createElement("div");
  const cols = loaded.map(([e, r]) => ({
    label: electionShortName(e.id),
    values: MONEY_SERIES.map(([, path]) => moneyEUR(r, path)),
  }));
  const allValues = cols.flatMap(c => c.values.filter(v => v != null));
  if (!allValues.length) {
    pane.innerHTML = `<div class="loading">Nė vienuose šio asmens rinkimuose turto ar pajamų nedeklaruota.</div>`;
    return pane;
  }

  const max = Math.max(...allValues, 1);
  const W = Math.max(560, cols.length * 132 + 100), H = 340;
  const mL = 84, mR = 12, mT = 16, mB = 64;
  const plotW = W - mL - mR, plotH = H - mT - mB;
  const y = (v) => mT + plotH - (v / max) * plotH;

  // 4 round-number gridlines
  const step = Math.pow(10, Math.floor(Math.log10(max / 4)));
  const tick = Math.ceil(max / 4 / step) * step;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" style="max-width:100%">`;
  for (let t = 0; t <= max; t += tick) {
    svg += `<line x1="${mL}" y1="${y(t)}" x2="${W - mR}" y2="${y(t)}" stroke="#e3e3de"/>` +
      `<text x="${mL - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="#6d6d68">${fmtEUR(t)}</text>`;
  }
  const groupW = plotW / cols.length, barW = Math.min(30, groupW * 0.24);
  cols.forEach((col, i) => {
    const cx = mL + groupW * (i + 0.5);
    col.values.forEach((v, s) => {
      const x = cx + (s - 1) * (barW + 3) - barW / 2;
      if (v == null) return;
      const h = Math.max(1.5, (v / max) * plotH);
      svg += `<rect x="${x.toFixed(1)}" y="${(mT + plotH - h).toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="${MONEY_SERIES[s][2]}" rx="2"><title>${MONEY_SERIES[s][0]}: ${fmtEUR(v)}</title></rect>`;
    });
    svg += `<text x="${cx}" y="${mT + plotH + 14}" text-anchor="end" font-size="11.5" fill="#1c1c1a" transform="rotate(-24 ${cx} ${mT + plotH + 14})">${col.label}</text>`;
  });
  svg += `<line x1="${mL}" y1="${mT + plotH}" x2="${W - mR}" y2="${mT + plotH}" stroke="#6d6d68"/></svg>`;

  const card = document.createElement("div"); card.className = "ecard";
  card.style.padding = "16px";
  card.innerHTML = svg +
    `<div style="display:flex;gap:18px;margin-top:8px;font-size:13px;color:#6d6d68">` +
    MONEY_SERIES.map(([label, , color]) =>
      `<span><span style="display:inline-block;width:11px;height:11px;background:${color};border-radius:2px;margin-right:5px"></span>${label}</span>`
    ).join("") +
    `<span style="margin-left:auto">nėra stulpelio — nedeklaruota arba nepaskelbta · užveskite pelę ant stulpelio, kad matytumėte sumą` +
    `</span></div>`;
  pane.appendChild(card);

  // the numbers behind the bars
  const t = document.createElement("table"); t.className = "cmp"; t.style.marginTop = "14px";
  t.innerHTML = "<thead><tr><th>Rodiklis</th></tr></thead><tbody></tbody>";
  for (const col of cols) { const th = document.createElement("th"); th.textContent = col.label; t.tHead.rows[0].appendChild(th); }
  MONEY_SERIES.forEach(([label], s) => {
    const tr = t.tBodies[0].insertRow();
    const th = document.createElement("th"); th.textContent = label; tr.appendChild(th);
    for (const col of cols) {
      const td = tr.insertCell();
      td.textContent = col.values[s] == null ? "—" : fmtEUR(col.values[s]);
      if (col.values[s] == null) td.className = "null";
    }
  });
  pane.appendChild(t);
  return pane;
}

boot();
</script>
