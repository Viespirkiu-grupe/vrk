function showAggregates() {
  location.hash = "";
  clearActiveRows();
  const root = document.getElementById("person");
  root.innerHTML = "";

  const bar = document.createElement("div");
  bar.style.cssText = "display:flex;gap:12px;align-items:center;margin-bottom:4px;flex-wrap:wrap";
  const h2 = document.createElement("h2");
  h2.style.cssText = "margin:0;font-size:20px";
  h2.textContent = "Rinkimų suvestinė";
  const select = document.createElement("select");
  select.id = "aggElection";
  select.style.cssText = "padding:6px 8px;border:1px solid var(--line);border-radius:6px";
  fillElectionSelect(select);
  const filtered = document.getElementById("fElection").value;
  if (filtered) select.value = filtered;
  bar.append(h2, select);
  root.appendChild(bar);
  const note = document.createElement("div");
  note.className = "aggnote";
  note.textContent = "Prie kiekvieno rodiklio nurodyta, iš kelių kandidatavimų jis apskaičiuotas — aprėptis keičia išvadas.";
  root.appendChild(note);
  const facetLine = document.createElement("div");
  root.appendChild(facetLine);
  const holder = document.createElement("div");
  root.appendChild(holder);

  function clearFacets() {
    for (const [, selectId] of FACET_LABELS) document.getElementById(selectId).value = "";
    renderList();
    render();
  }

  function render() {
    const id = select.value;
    const f = scopedFilters(id);
    facetLine.replaceChildren();
    appendFacetNote(facetLine, facetNote(f), clearFacets);
    const pairs = [];
    for (const p of INDEX.people) for (const e of p.e) if (candidacyMatches(e, f)) pairs.push([p, e]);
    const candidacies = pairs.map(([, e]) => e);
    const total = candidacies.length;
    holder.replaceChildren();

    const summary = document.createElement("div"); summary.className = "ecard";
    summary.style.padding = "14px 16px";
    const won = candidacies.filter(e => e.w === true).length;
    const unknown = candidacies.filter(e => e.w === undefined).length;
    summary.textContent = `${electionName(id)} — kandidatavimų: ${fmtInt(total)}, ` +
      `išrinkta: ${fmtInt(won)}` +
      (unknown ? `, be rezultatų duomenų: ${fmtInt(unknown)}` : "");
    holder.appendChild(summary);
    // A term's figures cover its seat-fills too; say which, and how many
    // candidacies each adds, so the denominator stays explicit.
    const seatFills = new Map();
    for (const e of candidacies) if (e.id !== id) seatFills.set(e.id, (seatFills.get(e.id) || 0) + 1);
    if (seatFills.size) {
      const dateOf = (eid) => (ELECTIONS.get(eid) || {}).date || "";
      const note = document.createElement("div"); note.className = "aggnote";
      note.textContent = "Skaičiai apima ir tos kadencijos naujus bei pakartotinius rinkimus: " +
        [...seatFills].sort((a, b) => dateOf(a[0]).localeCompare(dateOf(b[0])))
          .map(([eid, n]) => `${electionShortName(eid)} (${fmtInt(n)})`).join(", ") + ".";
      holder.appendChild(note);
    }

    const section = (title, denominatorText) => {
      const wrap = document.createElement("div"); wrap.className = "sec";
      const h = document.createElement("h4"); h.textContent = title;
      wrap.appendChild(h);
      if (denominatorText) {
        const d = document.createElement("div"); d.className = "aggnote";
        d.textContent = denominatorText;
        wrap.appendChild(d);
      }
      holder.appendChild(wrap);
      return wrap;
    };

    // Party mix
    const withParty = candidacies.filter(e => e.p);
    const partyWrap = section(
      "Iškėlusios partijos ir komitetai",
      `Iškėlėjas žinomas ${fmtInt(withParty.length)} iš ${fmtInt(total)} kandidatavimų (${pct(withParty.length, total)}).`
    );
    if (withParty.length) {
      const counts = new Map();
      for (const e of withParty) counts.set(e.p, (counts.get(e.p) || 0) + 1);
      const top = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      const t = document.createElement("table"); t.className = "cmp";
      t.innerHTML = "<thead><tr><th>Iškėlėjas</th><th>Kandidatavimų</th><th>Dalis (iš žinomų)</th><th>Išrinkta</th></tr></thead><tbody></tbody>";
      for (const [pid, count] of top.slice(0, 15)) {
        const tr = t.tBodies[0].insertRow();
        const th = document.createElement("th"); th.textContent = (INDEX.parties[pid] || {}).n || pid; tr.appendChild(th);
        tr.insertCell().textContent = fmtInt(count);
        tr.insertCell().textContent = pct(count, withParty.length);
        tr.insertCell().textContent = fmtInt(withParty.filter(e => e.p === pid && e.w === true).length);
      }
      if (top.length > 15) {
        // The remainder row's Išrinkta cell used to be the empty string
        // while its count and share were filled — and an empty cell in a
        // column of numbers reads as a zero. The column then disagreed with
        // the summary line above it: 2019 municipal said "išrinkta 1 505"
        // over a column summing to 1 184, with 321 winners (21.3 % of the
        // remainder) hidden in the blank. 17 of the 55 terms hid at least
        // one, 1,101 elected candidacies in all (issue #148).
        const restIds = new Set(top.slice(15).map(([pid]) => pid));
        const rest = top.slice(15).reduce((n, [, c]) => n + c, 0);
        const restWon = withParty.filter(e => restIds.has(e.p) && e.w === true).length;
        const tr = t.tBodies[0].insertRow();
        const th = document.createElement("th"); th.textContent = `kiti (${top.length - 15})`; tr.appendChild(th);
        tr.insertCell().textContent = fmtInt(rest);
        tr.insertCell().textContent = pct(rest, withParty.length);
        tr.insertCell().textContent = fmtInt(restWon);
      }
      const wrap = document.createElement("div"); wrap.className = "tablewrap";
      wrap.appendChild(t);
      partyWrap.appendChild(wrap);
    }

    // Votes (issue #133): the preference votes on the list and the votes of
    // the single-winner race, where the records carry them -- and a plain
    // statement where they do not, because an election with no vote data
    // is not an election nobody voted in.
    const withVotes = pairs.filter(([, e]) => e.v != null);
    const withRace = pairs.filter(([, e]) => e.cv != null);
    const votesWrap = section(
      "Balsai",
      withVotes.length
        ? `Pirmumo balsai žinomi ${fmtInt(withVotes.length)} iš ${fmtInt(total)} kandidatavimų (${pct(withVotes.length, total)}): ` +
          `iš viso ${fmtInt(withVotes.reduce((n, [, e]) => n + e.v, 0))}, mediana ${fmtInt(median(withVotes.map(([, e]) => e.v)))}.`
        : withRace.length
          ? `Balsai apygardoje žinomi ${fmtInt(withRace.length)} iš ${fmtInt(total)} kandidatavimų (${pct(withRace.length, total)}).`
          : "Šių rinkimų įrašuose balsų skaičių nėra: VRK rezultatus skelbia puslapiuose, kurių korpusas neskaito (žr. docs/CANDIDACIES.md, votes_source)."
    );
    const ranking = (title, key, unit) => {
      const rows = pairs.filter(([, e]) => e[key] != null).sort((a, b) => b[1][key] - a[1][key]).slice(0, 10);
      if (!rows.length) return;
      const h = document.createElement("div"); h.className = "aggnote"; h.textContent = title;
      votesWrap.appendChild(h);
      const t = document.createElement("table"); t.className = "cmp";
      t.innerHTML = `<thead><tr><th>#</th><th>Asmuo</th><th>Iškėlėjas</th><th>${unit}</th><th>Išrinkta</th></tr></thead><tbody></tbody>`;
      rows.forEach(([p, e], i) => {
        const tr = t.tBodies[0].insertRow();
        tr.insertCell().textContent = String(i + 1);
        const cell = tr.insertCell();
        const a = document.createElement("a");
        a.href = "#" + p.pid;
        a.textContent = p.n;
        a.addEventListener("click", (ev) => { ev.preventDefault(); showPerson(p); });
        cell.appendChild(a);
        tr.insertCell().textContent = partyNameOf(e) || "—";
        const votes = tr.insertCell(); votes.textContent = fmtInt(e[key]); votes.style.fontVariantNumeric = "tabular-nums";
        tr.insertCell().textContent = e.w === true ? "taip" : e.w === false ? "ne" : "—";
      });
      const wrap = document.createElement("div"); wrap.className = "tablewrap";
      wrap.appendChild(t);
      votesWrap.appendChild(wrap);
    };
    ranking("Daugiausiai pirmumo balsų", "v", "Pirmumo balsai");
    ranking("Daugiausiai balsų apygardoje (paskutinis turas)", "cv", "Balsai apygardoje");

    // Education mix
    const withEducation = candidacies.filter(e => e.ed != null);
    const levels = INDEX.educationLevels || [];
    const higherRank = levels.findIndex(l => l.id === "aukstasis-nedetalizuotas") + 1;
    const eduWrap = section(
      "Išsilavinimas",
      `Lygį galima nustatyti ${fmtInt(withEducation.length)} iš ${fmtInt(total)} kandidatavimų (${pct(withEducation.length, total)}).`
    );
    if (withEducation.length && higherRank) {
      const higher = withEducation.filter(e => e.ed >= higherRank).length;
      const line = document.createElement("div");
      line.style.margin = "0 0 8px";
      line.textContent = `Aukštasis (įskaitant nedetalizuotą „Aukštasis“): ${fmtInt(higher)} — ${pct(higher, withEducation.length)} nurodžiusiųjų, ${pct(higher, total)} visų.`;
      eduWrap.appendChild(line);
      const counts = new Map();
      for (const e of withEducation) counts.set(e.ed, (counts.get(e.ed) || 0) + 1);
      const t = document.createElement("table"); t.className = "cmp";
      t.innerHTML = "<thead><tr><th>Lygis</th><th>Kandidatavimų</th><th>Dalis (iš nurodžiusiųjų)</th></tr></thead><tbody></tbody>";
      for (const [rank, count] of [...counts.entries()].sort((a, b) => b[0] - a[0])) {
        const tr = t.tBodies[0].insertRow();
        const th = document.createElement("th"); th.textContent = (levels[rank - 1] || {}).label || String(rank); tr.appendChild(th);
        tr.insertCell().textContent = fmtInt(count);
        tr.insertCell().textContent = pct(count, withEducation.length);
      }
      const wrap = document.createElement("div"); wrap.className = "tablewrap";
      wrap.appendChild(t);
      eduWrap.appendChild(wrap);
    }

    // Money medians
    const moneyWrap = section("Deklaruotas turtas ir pajamos (mediana, €)", null);
    const t = document.createElement("table"); t.className = "cmp";
    t.innerHTML = "<thead><tr><th>Rodiklis</th><th>Mediana</th><th>Deklaravusių</th></tr></thead><tbody></tbody>";
    MONEY_SERIES.forEach(([label], seriesIndex) => {
      const values = candidacies.map(e => e.m && e.m[seriesIndex]).filter(v => v != null);
      const tr = t.tBodies[0].insertRow();
      const th = document.createElement("th"); th.textContent = label; tr.appendChild(th);
      const mid = median(values);
      const midCell = tr.insertCell();
      midCell.textContent = mid == null ? "—" : fmtEUR(mid);
      midCell.style.fontVariantNumeric = "tabular-nums";
      if (mid == null) midCell.className = "null";
      tr.insertCell().textContent = values.length
        ? `${fmtInt(values.length)} iš ${fmtInt(total)} (${pct(values.length, total)})`
        : "—";
    });
    const wrap = document.createElement("div"); wrap.className = "tablewrap";
    wrap.appendChild(t);
    moneyWrap.appendChild(wrap);
    const dsCount = candidacies.filter(e => e.ds).length;
    if (dsCount) {
      const dsNote = document.createElement("div");
      dsNote.className = "aggnote";
      dsNote.textContent = `Pastaba: ${fmtInt(dsCount)} kandidatavimų pajamų suma — tik darbo santykių pajamos (žr. gautos pajamos), nes deklaracijos bendra eilutė nepatikima.`;
      moneyWrap.appendChild(dsNote);
    }
  }
  select.addEventListener("change", render);
  render();
}

  root.appendChild(bar);
  const facetLine = document.createElement("div");
  root.appendChild(facetLine);
  const holder = document.createElement("div");
  root.appendChild(holder);

  function clearFacets() {
    for (const id of ["fElection", ...FACET_LABELS.map(([, s]) => s)]) {
      document.getElementById(id).value = "";
    }
    renderList();
    render();
  }

  function render() {
    const s = +document.getElementById("mvSeries").value;
    const dir = document.getElementById("mvDir").value;
    const f = activeFilters();
    facetLine.replaceChildren();
    appendFacetNote(facetLine, facetNote(f, { withElection: true }), clearFacets);
    const rows = [];
    for (const p of INDEX.people) {
      // The ranking is over a person's whole money series, so the facets
      // scope which *people* are ranked rather than which of their
      // candidacies count — a filtered person's own first and last figure
      // is still what the row compares (issue #148).
      if (f.any && !p.e.some(e => candidacyMatches(e, f))) continue;
      const vals = p.e.filter(e => e.m && e.m[s] != null);
      if (vals.length < 2) continue;
      const first = vals[0], last = vals[vals.length - 1];
      if (first.id === last.id) continue;
      const delta = last.m[s] - first.m[s];
      if (delta === 0) continue;
      rows.push({ p, first, last, delta });
    }
    rows.sort((a, b) => dir === "desc" ? b.delta - a.delta : a.delta - b.delta);
    const t = document.createElement("table"); t.className = "cmp";
    t.innerHTML = `<thead><tr><th>#</th><th>Asmuo</th><th>Nuo</th><th>Iki</th><th>Δ</th></tr></thead><tbody></tbody>`;
    rows.slice(0, 100).forEach((r, i) => {
      const tr = t.tBodies[0].insertRow();
      tr.insertCell().textContent = String(i + 1);
      const nameCell = tr.insertCell();
      const a = document.createElement("a");
      a.href = "#" + r.p.pid;
      a.textContent = `${r.p.n} · ${r.p.b || "?"}`;
      a.addEventListener("click", (ev) => { ev.preventDefault(); showPerson(r.p); });
      nameCell.appendChild(a);
      // "ds" marks an income figure that is the 1990s form's employment row
      // rather than a declared total (the `deklaruotos-pajamos` concept).
      const tag = (e) => electionShortName(e.id) + (s === 2 && e.ds ? ", darbo santykiai" : "");
      tr.insertCell().textContent = `${fmtEUR(r.first.m[s])} (${tag(r.first)})`;
      tr.insertCell().textContent = `${fmtEUR(r.last.m[s])} (${tag(r.last)})`;
      const d = tr.insertCell();
      d.textContent = (r.delta > 0 ? "+" : "−") + fmtEUR(Math.abs(r.delta));
      d.style.color = r.delta > 0 ? "var(--win)" : "#a03325";
      d.style.fontVariantNumeric = "tabular-nums";
    });
    const wrap = document.createElement("div"); wrap.className = "tablewrap";
    wrap.appendChild(t);
    holder.replaceChildren(wrap);
  }
  document.getElementById("mvSeries").addEventListener("change", render);
  document.getElementById("mvDir").addEventListener("change", render);
  render();
}

// The one shared money-string rule, mirrored by parse_money_text in
// scripts/build_person_index.py and held together by the fixture list in
// tests/test_dashboard_money_rendering.py: strip the euro sign and
// whitespace, allow one decimal separator (comma or dot), refuse anything
// else. It used to hand multi-separator strings to parseFloat, whose prefix
// parse silently read "1.234.567,89" as 1.234 while the builder stored None.
function parseMoney(v) {
  if (v == null) return null;
  if (typeof v === "number") return Number.isFinite(v) ? v : null;
  if (typeof v !== "string") return null;
  const cleaned = v.replace(/[€\s]/g, "");
  if (!/^-?\d+(?:[.,]\d+)?$/.test(cleaned)) return null;
  return parseFloat(cleaned.replace(",", "."));
}

// The 2012-2015 pages declare in litas (`valiuta: "Lt"`); converted at the
// irrevocable 2015 changeover rate so a person's series stays comparable.
// Mirrors scripts/build_person_index.py, which does the same for people.json.
const LITAS_PER_EURO = 3.4528;
function declaredInLitas(record) {
  const d = (record.normalized || {})["turto-ir-pajamu-deklaracijos"];
  return !!d && d.valiuta === "Lt";
}

// The `deklaruotos-pajamos` concept, mirrored from
// scraper/shared/deklaracijos.py. The 1990s form prints rows 1 and 20 of its
// income section and row 20 is not always trustworthy -- it fails by rendering
// 0 against a non-zero row 1 -- so the parser refuses it and `gautos-pajamos`
// is null on 4,463 of the 1997 municipal election's 6,276 records. Row 1 is
// printed on every one of them and is the only income figure those records
// have; charting nothing there said "declared no income", which is not what
// the page says. It is employment income, not a total, and the cell says so.
const INCOME_PATH = "turto-ir-pajamu-deklaracijos.gautos-pajamos";
const EMPLOYMENT_INCOME_PATH = "turto-ir-pajamu-deklaracijos.gautos-pajamos-darbo-santykiu";
function declaredIncome(normalized) {
  const total = parseMoney(resolvePath(normalized, INCOME_PATH));
  if (total != null) return { value: total, employmentOnly: false };
  const row1 = parseMoney(resolvePath(normalized, EMPLOYMENT_INCOME_PATH));
  if (row1 != null) return { value: row1, employmentOnly: true };
  return { value: null, employmentOnly: false };
}
function incomeIsEmploymentOnly(record) {
  return declaredIncome(record.normalized || {}).employmentOnly;
}

function moneyEUR(record, path) {
  const v = path === INCOME_PATH
    ? declaredIncome(record.normalized || {}).value
    : parseMoney(resolvePath(record.normalized || {}, path));
  if (v == null) return null;
  return declaredInLitas(record) ? v / LITAS_PER_EURO : v;
}

const fmtEUR = (n) => n.toLocaleString("lt-LT", { maximumFractionDigits: 0 }) + " €";

function buildAssetPane(loaded, failedCount = 0) {
  const pane = document.createElement("div");
  const cols = loaded.map(([e, r]) => ({
    label: electionShortName(e.id),
    values: MONEY_SERIES.map(([, path]) => moneyEUR(r, path)),
    employmentOnly: incomeIsEmploymentOnly(r),
  }));
  const allValues = cols.flatMap(c => c.values.filter(v => v != null));
  if (!allValues.length) {
    // "Nothing was declared" is a claim about the data. With every record
    // failing to load it is a claim about nothing, and the pane made it
    // anyway (issue #148); say which of the two this is.
    pane.innerHTML = failedCount
      ? `<div class="loading">Nėra ką rodyti: ${failedCount} ${plural(failedCount, "įrašas", "įrašai", "įrašų")} neįkelti, o iš įkeltų nė vienas neturi turto ar pajamų duomenų.</div>`
      : `<div class="loading">Nė vienuose šio asmens rinkimuose turto ar pajamų nedeklaruota.</div>`;
    return pane;
  }

  const max = Math.max(...allValues, 1);
  const W = Math.max(560, cols.length * 132 + 100), H = 340;
  const mL = 84, mR = 12, mT = 16, mB = 64;
  const plotW = W - mL - mR, plotH = H - mT - mB;
  const y = (v) => mT + plotH - (v / max) * plotH;

  // 4 round-number gridlines
  const step = Math.pow(10, Math.floor(Math.log10(max / 4)));
  const tick = Math.ceil(max / 4 / step) * step;
  // The svg keeps its natural width and the card scrolls instead: squeezed
  // to the pane, an 8-election chart shrank its 11px labels to 3.3px.
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">`;
  for (let t = 0; t <= max; t += tick) {
    svg += `<line x1="${mL}" y1="${y(t)}" x2="${W - mR}" y2="${y(t)}" stroke="#e3e3de"/>` +
      `<text x="${mL - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="#6d6d68">${fmtEUR(t)}</text>`;
  }
  const groupW = plotW / cols.length, barW = Math.min(30, groupW * 0.24);
  cols.forEach((col, i) => {
    const cx = mL + groupW * (i + 0.5);
    col.values.forEach((v, s) => {
      const x = cx + (s - 1) * (barW + 3) - barW / 2;
      if (v == null) return;
      const h = Math.max(1.5, (v / max) * plotH);
      svg += `<rect x="${x.toFixed(1)}" y="${(mT + plotH - h).toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="${MONEY_SERIES[s][2]}" rx="2"><title>${MONEY_SERIES[s][0]}: ${fmtEUR(v)}</title></rect>`;
    });
    svg += `<text x="${cx}" y="${mT + plotH + 14}" text-anchor="end" font-size="11.5" fill="#1c1c1a" transform="rotate(-24 ${cx} ${mT + plotH + 14})">${col.label}</text>`;
  });
  svg += `<line x1="${mL}" y1="${mT + plotH}" x2="${W - mR}" y2="${mT + plotH}" stroke="#6d6d68"/></svg>`;

  const card = document.createElement("div"); card.className = "ecard";
  card.style.padding = "16px";
  card.innerHTML = `<div class="tablewrap">${svg}</div>` +
    `<div style="display:flex;gap:18px;margin-top:8px;font-size:13px;color:#6d6d68;flex-wrap:wrap">` +
    MONEY_SERIES.map(([label, , color]) =>
      `<span><span style="display:inline-block;width:11px;height:11px;background:${color};border-radius:2px;margin-right:5px"></span>${label}</span>`
    ).join("") +
    `<span style="margin-left:auto">nėra stulpelio — nedeklaruota arba nepaskelbta · užveskite pelę ant stulpelio, kad matytumėte sumą` +
    `</span></div>`;
  pane.appendChild(card);

  // the numbers behind the bars
  const t = document.createElement("table"); t.className = "cmp"; t.style.marginTop = "14px";
  t.innerHTML = "<thead><tr><th>Rodiklis</th></tr></thead><tbody></tbody>";
  for (const col of cols) { const th = document.createElement("th"); th.textContent = col.label; t.tHead.rows[0].appendChild(th); }
  let employmentOnly = false;
  MONEY_SERIES.forEach(([label, path], s) => {
    const tr = t.tBodies[0].insertRow();
    const th = document.createElement("th"); th.textContent = label; tr.appendChild(th);
    cols.forEach((col, i) => {
      const td = tr.insertCell();
      td.textContent = col.values[s] == null ? "—" : fmtEUR(col.values[s]);
      if (col.values[s] == null) td.className = "null";
      if (path === INCOME_PATH && col.values[s] != null && col.employmentOnly) {
        employmentOnly = true;
        td.textContent += " *";
        td.title = "Tik su darbo santykiais susijusios pajamos — puslapyje paskelbta bendra suma nepatikima";
      }
    });
  });
  const tableWrap = document.createElement("div"); tableWrap.className = "tablewrap";
  tableWrap.appendChild(t);
  pane.appendChild(tableWrap);
  if (employmentOnly) {
    const note = document.createElement("div");
    note.className = "loading";
    note.style.textAlign = "left";
    note.textContent = "* 1996–2000 m. deklaracijų išrašuose bendra pajamų suma prieštarauja pačios deklaracijos "
      + "1 eilutei, todėl neskelbiama; rodoma tos eilutės suma — tik su darbo santykiais susijusios pajamos.";
    pane.appendChild(note);
  }
  return pane;
}

boot();
</script>
</body>
</html>
