# One built site (scripts/build_site.py), shared by both servers in vrk.conf.
#
# Cache-Control is added without `always`, so it rides only on successful
# responses: a 404 under /_astro/ marked immutable would be kept at the edge
# for a year (issue #186).

server_tokens off;
autoindex off;

# Revalidation (issue #186): Cloudflare drops the ETag when it recompresses,
# so If-Modified-Since often decides alone. `before` answers 304 for any
# date not older than the file, as serve_dashboard.py does; nginx's default
# `exact` misses on a date the edge rewrote.
etag on;
if_modified_since before;

# The page, bundles and index ship .gz (and .br) copies beside them.
# Debian/Ubuntu: apt install libnginx-mod-http-brotli-static, then uncomment.
gzip_static on;
# brotli_static on;

# The records are compressed here.
gzip on;
gzip_vary on;
gzip_min_length 512;
gzip_types application/json application/javascript text/css image/svg+xml text/plain;

# Dotfiles: none are in the site, and none is ever served.
location ~ /\. {
    include /etc/nginx/snippets/vrk-headers.conf;
    return 404;
}

# The page's own routes (frontend/src/lib/routes.js, issue #184) answer with
# the page; its router picks the view. Only these: a mistyped asset or data
# URL stays a 404.
location ~ ^/(suvestine|iskelejai|apreptis|pokyciai|partiju-keitimai)/?$ {
    include /etc/nginx/snippets/vrk-headers.conf;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
}
location ~ ^/(asmuo|palyginti)/[^/]*/?$ {
    include /etc/nginx/snippets/vrk-headers.conf;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
}

# Astro names each bundle after its content.
location ^~ /_astro/ {
    include /etc/nginx/snippets/vrk-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location ^~ /portraits/ {
    include /etc/nginx/snippets/vrk-headers.conf;
    add_header Cache-Control $vrk_portrait_cache;
    try_files $uri =404;
}

location = / {
    include /etc/nginx/snippets/vrk-headers.conf;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
}

location = /VERSION {
    include /etc/nginx/snippets/vrk-headers.conf;
    add_header Cache-Control "no-cache";
    types { }
    default_type "text/plain; charset=utf-8";
}

# Everything else is a file of the site or a 404: `$uri` alone never
# matches a directory, so nothing is listed. The index, labels, concept map
# and records are rewritten in place and revalidated on every use.
location / {
    include /etc/nginx/snippets/vrk-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}
