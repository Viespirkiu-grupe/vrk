# The response hardening scripts/serve_dashboard.py sends (issue #160), on
# every response including errors (`always`). Included in each location of
# vrk-site.conf, because an `add_header` in a location drops every one it
# would otherwise inherit.
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'" always;
add_header Referrer-Policy "no-referrer" always;
