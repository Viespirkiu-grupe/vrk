# vrk.viespirkiai.org on nginx: the alternative to deploy/Caddyfile (issue #188).
#
# Caddy is the primary config (docs/DEPLOY.md says why). This one serves the
# same directory with the same headers, for a machine that already runs
# nginx. Install:
#
#   cp deploy/nginx/vrk.conf          /etc/nginx/conf.d/vrk.conf
#   cp deploy/nginx/vrk-site.conf     /etc/nginx/snippets/vrk-site.conf
#   cp deploy/nginx/vrk-headers.conf  /etc/nginx/snippets/vrk-headers.conf
#   nginx -t && systemctl reload nginx
#
# conf.d/ is included inside `http {}`, which is where `map` has to be.

# A portrait asked for with its set's version (`?v=…`, people.json
# `portraits.v`) never changes under that URL; a bare one is revalidated.
map $arg_v $vrk_portrait_cache {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

# The live site.
server {
    listen 127.0.0.1:8780;
    root /srv/vrk/current;
    include /etc/nginx/snippets/vrk-site.conf;
}

# The release being deployed, checked by scripts/smoke_check.py before
# scripts/deploy.sh switches `current` to it.
server {
    listen 127.0.0.1:8781;
    root /srv/vrk/next;
    include /etc/nginx/snippets/vrk-site.conf;
}
